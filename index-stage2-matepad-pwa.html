<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4E6B57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="周心怡的工作台">
<link rel="manifest" href="./matepad-app.webmanifest">
<title>周心怡的工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE; --card:#FFFFFF; --warm:#FBF9F4;
    --text:#1F1E1B; --sub:#8A867D; --sub2:#5C5A55; --line:#EBE7DE;
    --primary:#4E6B57; --primary-l:#EEF2EC; --primary-light:#EDF2EA; --primary-mid:#7BA688;
    --amber:#B07A4A; --amber-l:#FBF4EC; --wood:#B89968;
    --red:#C26A6A; --red-l:#FBEDEB;
    --yellow:#E0AE47; --yellow-l:#FBF2DE;
    --blue:#3B6FB0; --blue-l:#EAF1FB;
    --green:#7A8F5E; --green-l:#EDF2E6;
    --ring-track:#E6E4DF;
    --radius:22px; --radius-sm:14px;
    --bottom-nav-height:88px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    max-width:480px;margin:0 auto;
    padding:0 0 calc(var(--bottom-nav-height) + env(safe-area-inset-bottom) + 24px);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"Nunito",sans-serif;font-weight:800;letter-spacing:.5px;}
  body.no-tabbar{padding-bottom:20px;}
  .view{display:none;padding:12px 20px 0;}
  .view.show{display:block;}

  /* 顶部问候 */
  .greeting{margin:18px 0 14px;flex:1;min-width:0;}
  .greeting .hello{font-size:28px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:8px;}
  .greeting .hello-text{white-space:nowrap;}
  .greeting .hello-emoji{font-size:26px;line-height:1;flex:none;}
  .greeting .sub{font-size:13.5px;color:var(--sub);margin-top:6px;font-weight:700;}
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .streak-chip{display:inline-flex;align-items:center;gap:4px;background:var(--warm);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--wood);white-space:nowrap;}
  .streak-chip .ic{font-size:13px;display:inline-flex;align-items:center;}
  .ic .ic-svg,.ic-svg{width:1em;height:1em;display:inline-block;vertical-align:-.12em;}
  .exam-big{flex:none;background:var(--warm);border:1px solid var(--line);border-radius:18px;padding:11px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--wood);text-align:center;}
  .exam-big .exam-label{font-size:12px;font-weight:800;opacity:.9;line-height:1;}
  .exam-big .exam-days{font-size:12px;font-weight:800;line-height:1;display:flex;align-items:baseline;gap:3px;}
  .exam-big .exam-days .num{font-size:26px;font-weight:800;letter-spacing:.5px;}

  /* 进度环 */
  .ring-card{background:var(--card);border-radius:var(--radius);padding:18px 18px;display:flex;align-items:center;gap:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .ring{flex:none;width:56px;height:56px;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:7;stroke-linecap:round;}
  .ring .track{stroke:var(--ring-track);}
  .ring .fill{stroke:var(--primary-mid);stroke-dasharray:151;stroke-dashoffset:151;transition:stroke-dashoffset .6s ease;}
  .ring-txt{flex:1;}
  .ring-txt .top{font-size:13px;color:var(--sub);font-weight:700;}
  .ring-txt .big{font-size:18px;font-weight:800;margin-top:3px;}
  .ring-txt .big .num{font-size:24px;}
/* 跳过功能已移除，.chip.makeup 不再使用 */
  /* 作战地图入口按钮（进度卡右侧） */
  .map-btn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 13px;border-radius:16px;background:var(--green-l);border:1px solid rgba(122,143,94,.28);color:var(--green);font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;line-height:1.3;}
  .map-btn .ic-svg{width:20px;height:20px;}

  /* 作战地图视图 */
  #view-map h1{font-size:18px;margin:4px 0 2px;color:#7a5c3e;font-weight:800;}
  #view-map .map-sub{font-size:12px;color:var(--sub);margin-bottom:12px;}
  #view-map .map-phase{display:flex;gap:8px;margin-bottom:14px;}
  #view-map .map-ph{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;}
  #view-map .map-ph .t{font-size:12px;font-weight:700;color:#7a5c3e;}
  #view-map .map-ph .d{font-size:10px;color:var(--sub);margin-top:3px;}
  #view-map .map-tip{background:var(--amber-l);border:1px solid #f0e2c8;border-radius:10px;padding:10px 12px;font-size:12px;color:#8a6d4a;margin-bottom:14px;}
  #view-map .map-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
  #view-map .map-card h2{font-size:15px;margin:0 0 2px;color:#7a5c3e;}
  #view-map .map-card .cnt{font-size:11px;color:var(--sub);margin-bottom:8px;}
  #view-map .map-row{font-size:12.5px;line-height:1.75;border-top:1px dashed #f0e9dd;padding:8px 0;}
  #view-map .map-row:first-of-type{border-top:none;}
  #view-map .map-lab{display:inline-block;width:46px;color:var(--wood);font-weight:700;vertical-align:top;}
  #view-map .map-hot{color:var(--red);font-weight:700;}
  #view-map .map-key{color:#9a6a3a;font-weight:700;}
  #view-map .map-foot{font-size:11px;color:var(--sub);text-align:center;margin:6px 0 26px;}

  /* Focus 卡片 */
  .focus-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.04);}
  .focus-card .lab{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--primary);font-weight:800;margin-bottom:10px;}
  .focus-card .lab::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--primary);}
  .focus-card .title{font-size:22px;font-weight:800;line-height:1.35;margin-bottom:12px;}
  .focus-card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--warm);color:var(--sub2);}
  .chip.star{background:#FBF0E0;color:var(--wood);}
  .focus-card .desc{font-size:14px;color:var(--sub2);line-height:1.55;margin-bottom:14px;}
  .focus-bar{margin-bottom:18px;}
  .focus-bar .track{height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
  .focus-bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-mid),var(--green));transition:width .55s cubic-bezier(.25,.8,.25,1);}
  .focus-bar .info{font-size:12px;color:var(--sub);font-weight:700;margin-top:7px;display:flex;justify-content:space-between;}
  .btn-primary{width:100%;border:none;border-radius:16px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;padding:15px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;font-size:14px;font-weight:700;color:var(--sub2);cursor:pointer;font-family:inherit;}

  /* 状态切换 */
  .mode-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .mode-card .tx{font-size:14px;font-weight:700;line-height:1.45;}
  .mode-card .tx small{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-top:2px;}
  .mode-card .switch{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;color:var(--primary);cursor:pointer;font-family:inherit;}
  .mode-card.on{background:var(--primary-l);}

  /* 简单列表 */
  .sec-title{font-size:13px;color:var(--sub);font-weight:800;letter-spacing:1px;margin:0 0 10px;}
  .simple-list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.02);margin-bottom:16px;}
  .simple-list .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .simple-list .item:last-child{border-bottom:none;}
  .simple-list .dot{width:8px;height:8px;border-radius:50%;background:var(--primary-mid);flex:none;}
  .simple-list .body{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.35;}
  .simple-list .time{font-size:13px;color:var(--sub);font-weight:700;}

  /* 底部导航 */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 40px);max-width:440px;
    background:#fff;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.08);display:flex;z-index:30;
    padding:6px;}
  .tabbar button{flex:1;border:none;background:transparent;border-radius:999px;padding:9px 0 10px;cursor:pointer;
    font-family:inherit;color:var(--sub);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s;}
  .tabbar button .ic{font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;height:22px;}
  .tabbar button.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(78,107,87,.25);}

  /* 今日视图 */
  .page-title{font-size:28px;font-weight:800;margin:18px 0 16px;}
  .progress-pill{background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .progress-pill .ring{flex:none;width:56px;height:56px;transform:rotate(-90deg);}
  .progress-pill .ring circle{fill:none;stroke-width:7;stroke-linecap:round;}
  .progress-pill .ring .track{stroke:var(--ring-track);}
  .progress-pill .ring .fill{stroke:var(--primary-mid);stroke-dasharray:151;stroke-dashoffset:151;transition:stroke-dashoffset .6s ease;}
  .progress-pill .txt{flex:1;font-size:18px;font-weight:800;}
  .progress-pill .txt .num{font-size:24px;}

  .section-lbl{font-size:13px;color:var(--sub);font-weight:800;letter-spacing:1px;margin:22px 0 10px;}
  .active-card{background:rgba(122,143,94,.10);border:1px solid rgba(122,143,94,.22);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:0 4px 16px rgba(122,143,94,.08);}
  .active-card .subj{font-size:12px;color:var(--green);font-weight:700;margin-bottom:6px;}
  .active-card .title{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:6px;color:var(--text);}
  .active-card .step{font-size:13px;color:var(--sub2);margin-bottom:14px;}
  .active-card .btn-primary{margin-bottom:0;}

  .today-list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.02);margin-bottom:14px;}
  .today-list .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .today-list .row:last-child{border-bottom:none;}
  .today-list .check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
  .today-list .row.done .check{background:var(--primary-mid);border-color:var(--primary-mid);}
  .today-list .row.done .body{text-decoration:line-through;color:var(--sub);}
  .today-list .body{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.35;}
  .today-list .time{font-size:13px;color:var(--sub);font-weight:700;}

  .done-fold{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;color:var(--sub);font-size:13px;font-weight:800;cursor:pointer;}
  .settle-line{margin-top:10px;background:var(--primary-l);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .settle-line .tx{font-size:14px;color:var(--primary);font-weight:700;}
  .settle-line .arr{color:var(--primary);font-weight:800;}

  /* 任务执行视图 */
  .flow-header{display:flex;align-items:center;gap:10px;margin:14px 0 10px;}
  .flow-header .back{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--sub2);flex:none;}
  .flow-header .pause{flex:none;min-width:70px;text-align:center;font-size:13px;color:var(--sub);font-weight:700;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;}
  .flow-header .spacer{flex:1;}

  .flow-title-row{margin:0 0 10px;}
  .flow-title-row .big-title{font-size:22px;font-weight:800;line-height:1.35;}

  .flow-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .flow-res{display:flex;align-items:flex-start;gap:8px;background:var(--green-l);border:1px solid rgba(122,143,94,.45);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--sub2);line-height:1.5;}
  .flow-res .ic-svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--green);}
  .flow-res .lab{flex:none;font-weight:800;color:var(--green);}
  .flow-progress{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:16px;}

  .step-bar{margin:0 0 18px;}
  .step-bar .track{height:10px;border-radius:999px;background:var(--line);overflow:hidden;position:relative;}
  .step-bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-mid),var(--green));transition:width .55s cubic-bezier(.25,.8,.25,1);position:relative;overflow:hidden;}
  .step-bar .bar-info{font-size:12px;color:var(--sub);font-weight:700;margin-top:8px;display:flex;align-items:center;justify-content:space-between;}
  .step-bar .bar-undo{font-size:12px;color:var(--sub);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:3px;}

  .step-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,.04);transition:box-shadow .2s;}

  .step-current{display:flex;align-items:flex-start;gap:10px;position:relative;min-height:82px;}
  .step-current .step-circle-col{display:flex;flex-direction:column;align-items:flex-start;flex:none;}
  .step-current .step-circle-col .step-label{font-size:10px;color:var(--sub);font-weight:700;line-height:1;margin-bottom:5px;}
  .step-current .circle{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--sub);background:#fff;cursor:pointer;}
  .step-current .circle.done{background:var(--primary-mid);border-color:var(--primary-mid);color:#fff;}
  /* .circle.todo 已不再使用（跳过功能已移除） */
  .step-current .body{flex:1;min-width:0;padding-right:92px;padding-top:15px;}
  .step-current .title-row{display:flex;align-items:center;}
  .step-current .title{font-size:20px;font-weight:800;line-height:1.35;flex:1;}
  .step-current .timer-box{text-align:right;flex:none;position:absolute;right:0;top:0;width:86px;height:44px;}
  .step-current .timer-box .lab{position:absolute;top:0;right:0;font-size:10px;color:var(--sub);font-weight:700;line-height:1;}
  .step-current .timer-box .time{position:absolute;top:18px;right:0;font-size:26px;font-weight:800;color:var(--amber);font-family:"Nunito",sans-serif;letter-spacing:.5px;line-height:1;}
  .step-current .time-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-l);padding:5px 10px;border-radius:999px;margin-top:8px;}
  .step-current .time-chip .ic-svg{width:13px;height:13px;vertical-align:-.05em;}
  .step-current .avg-line{font-size:11px;color:var(--sub);margin-top:6px;}
  .split-undo{position:absolute;right:0;top:52px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--primary);background:var(--green-l);border:1px solid rgba(122,143,94,.4);border-radius:999px;padding:5px 10px;cursor:pointer;}
  .split-undo .ic-svg{width:13px;height:13px;vertical-align:-.05em;}

  .step-card .desc{font-size:14px;color:var(--sub2);line-height:1.6;margin:12px 0 0;}
  .tip{background:var(--warm);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub2);line-height:1.5;margin-bottom:18px;}

  .next-list-title{font-size:12px;color:var(--sub);font-weight:700;margin:18px 0 10px;}
  .next-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;min-height:120px;transition:min-height .25s ease;}
  .next-card{background:var(--card);border-radius:var(--radius);padding:13px 16px;box-shadow:0 2px 10px rgba(0,0,0,.02);font-size:14px;font-weight:700;color:var(--sub2);line-height:1.45;display:flex;align-items:center;justify-content:space-between;transition:opacity .2s ease,transform .2s ease;}
  .next-card .time{flex:none;font-size:12px;color:var(--sub);font-weight:700;background:var(--warm);padding:4px 10px;border-radius:999px;margin-left:10px;}
  .next-card.fold{justify-content:flex-start;color:var(--sub);}

  #view-flow.show{padding-bottom:150px;}
  .flow-ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 40px);max-width:440px;background:var(--bg);padding:14px 0;border-radius:22px;z-index:10;}
  .flow-ctrl .btn-primary{margin-bottom:12px;}
  .flow-ctrl .btn-row{display:flex;gap:10px;}
  .flow-ctrl .btn-row button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 2px;font-size:13px;font-weight:700;color:var(--sub2);cursor:pointer;font-family:inherit;}

  /* 任务准备页 */

  /* 月历 */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin:18px 0 16px;}
  .cal-header .title{font-size:28px;font-weight:800;}
  .cal-arrows{display:flex;gap:8px;}
  .cal-arrows button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--sub2);cursor:pointer;font-family:inherit;}
  .cal-month{text-align:center;font-size:17px;font-weight:800;margin-bottom:14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px;}
  .cal-grid .wd{text-align:center;font-size:12px;color:var(--sub);font-weight:800;padding:4px 0;}
  .cal-grid .cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:#fff;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;position:relative;gap:4px;}
  .cal-grid .cell.today{box-shadow:0 0 0 2px var(--primary) inset;}
  .cal-grid .cell.muted{color:var(--line);}
  .cal-grid .cell.mk-red{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(194,106,106,.28);}
  .cal-grid .cell.mk-yellow{background:var(--yellow);color:#4A3510;box-shadow:0 2px 8px rgba(224,174,71,.28);}
  .cal-grid .cell.mk-done{background:rgba(78,107,87,.65);color:#fff;box-shadow:0 2px 8px rgba(78,107,87,.28);}
  .cal-grid .cell.mk-red.today,.cal-grid .cell.mk-yellow.today,.cal-grid .cell.mk-done.today{box-shadow:0 0 0 2px var(--text) inset;}
  .cal-grid .cell.mk-red.muted,.cal-grid .cell.mk-yellow.muted,.cal-grid .cell.mk-done.muted{opacity:.45;}
  .cal-grid .cell .num-ring{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0 2px;border-radius:50%;border:2px solid var(--green);color:var(--green);box-sizing:border-box;font-size:14px;line-height:1;}
  .cal-grid .cell.mk-red .num-ring,.cal-grid .cell.mk-yellow .num-ring,.cal-grid .cell.mk-done .num-ring{border-color:#fff;color:#fff;}

  .event-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .event-card .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .event-card .tx{flex:1;font-size:14px;font-weight:700;line-height:1.4;}
  .event-card .date{font-size:12px;color:var(--sub);font-weight:700;margin-top:2px;}
  .legend{display:flex;gap:6px;flex-wrap:nowrap;justify-content:space-between;margin:6px 0 14px;font-size:11.5px;color:var(--sub);font-weight:700;}
  .legend span{display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .legend i{width:7px;height:7px;border-radius:50%;}
  .legend i.sw{width:10px;height:10px;border-radius:3px;}
  .legend i.red{background:var(--red);}
  .legend i.yellow{background:var(--yellow);}
  .legend i.green{background:var(--green);}
  .legend i.ringic{width:10px;height:10px;border-radius:50%;border:2px solid var(--green);box-sizing:border-box;}
  .phase-hint{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px;}
  .phase-hint .ph{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#F4F1EA;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--sub2);}
  .phase-hint .ph .d{width:7px;height:7px;border-radius:50%;flex:none;}
  .phase-hint .ph .sw{font-family:"Nunito",sans-serif;font-weight:700;color:var(--sub);margin-left:2px;}
  .phase-hint .ph-sw{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--sub);background:#F4F1EA;border:1px solid var(--line);padding:5px 11px;border-radius:999px;}

  /* 四个阶段卡片：日期醒目在上，标题缩小在下 */
  .phase{border-radius:var(--radius);padding:16px 18px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
  .phase.p1{background:linear-gradient(135deg,#5B7E66,#4E6B57);}
  .phase.p2{background:linear-gradient(135deg,#8A9A5B,#6F7D45);}
  .phase.p3{background:linear-gradient(135deg,#C08A4A,#B07A4A);}
  .phase.p4{background:linear-gradient(135deg,#B35D57,#A14A44);}
  .phase-head{display:block;}
  .phase-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin:5px 0 10px;}
  .phase .pd{font-size:20px;font-weight:800;letter-spacing:.3px;line-height:1.25;min-width:0;}
  .phase .pn{font-size:12.5px;font-weight:700;opacity:.85;margin:0;}
  .phase ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.75;opacity:.96;}
  .phase .cur{position:static;justify-self:end;white-space:nowrap;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 9px;}

  /* 我的 */
  .stat-card{background:var(--card);border-radius:var(--radius);padding:22px 18px;display:flex;justify-content:space-around;text-align:center;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .stat-card .numv{font-size:32px;font-weight:800;color:var(--primary);}
  .stat-card .lbl{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px;}
  .section-title{font-size:16px;font-weight:800;margin:22px 0 12px;}
  .ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .ach-item{background:var(--card);border-radius:var(--radius-sm);padding:14px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03);}
  .ach-item .ic{font-size:24px;margin-bottom:6px;display:inline-flex;align-items:center;justify-content:center;height:26px;}
  .ach-item .t{font-size:11px;color:var(--sub);font-weight:700;}
  .ach-item.locked{opacity:.55;}

  /* 每日用时曲线 */
  .timecard{background:var(--card);border-radius:var(--radius);padding:16px 16px 12px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .timecard .ttl{font-size:15px;font-weight:800;margin-bottom:3px;}
  .timecard .sub{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:10px;}
  .tc-head{font-size:12px;color:var(--sub);font-weight:800;margin-bottom:6px;}
  .tc-head b{color:var(--text);}
  .timechart{width:100%;height:auto;display:block;}
  .tc-legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:8px;}
  .tc-legend .it{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--sub2);}
  .tc-legend .sw{width:13px;height:4px;border-radius:2px;}
  .tc-empty{font-size:13px;color:var(--sub);padding:22px 4px;text-align:center;line-height:1.6;}

  .subj-progress{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
 .subj-progress .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
 .subj-progress .nm{font-size:14px;font-weight:800;}
 .subj-progress .overall{font-size:12px;font-weight:800;color:var(--sub2);white-space:nowrap;}
 .subj-progress .rounds{display:flex;flex-direction:column;gap:8px;}
  .subj-progress .round-row{display:flex;align-items:center;gap:10px;opacity:.5;}
  .subj-progress .round-row.cur{opacity:1;}
  .subj-progress .round-lb{font-size:12px;font-weight:700;color:var(--sub2);white-space:nowrap;display:flex;align-items:center;gap:5px;min-width:88px;}
  .subj-progress .round-lb small{font-size:11px;color:var(--sub);font-weight:600;}
  .subj-progress .round-lb .cur-tag{font-size:10px;background:var(--primary);color:#fff;padding:2px 7px;border-radius:999px;font-weight:800;}
  .subj-progress .round-bar{flex:1;height:6px;background:var(--ring-track);border-radius:999px;overflow:hidden;}
  .subj-progress .round-bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease;}
  .subj-progress .round-pct{font-size:13px;font-weight:800;color:var(--sub2);min-width:36px;text-align:right;}
  .subj-progress .round-row.cur .round-pct{color:var(--primary);}

  .action-list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .action-list .row{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;font-weight:700;}
  .action-list .row:last-child{border-bottom:none;}
  .action-list .row .ic{font-size:18px;color:var(--sub);display:inline-flex;align-items:center;justify-content:center;height:20px;}
  .action-list .row .arr{margin-left:auto;color:var(--sub);font-weight:800;}

  /* 结算 */
  .settle-header{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;}
  .settle-header .title{font-size:28px;font-weight:800;}
  .settle-header .later{color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;}
  .settle-date{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:22px;}
  .big-count{display:flex;align-items:baseline;gap:10px;margin-bottom:22px;}
  .big-count .n{font-size:48px;font-weight:800;color:var(--primary);line-height:1;}
  .big-count .t{font-size:15px;color:var(--sub2);font-weight:700;}
  .sec-lbl{font-size:13px;color:var(--sub);font-weight:800;letter-spacing:1px;margin-bottom:10px;}
  .settle-task{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.02);}
  .settle-task .title{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:8px;}
  .settle-task .meta{font-size:12.5px;color:var(--sub);font-weight:700;}
  .opt-card{border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer;}
  .opt-card .ot{font-size:15px;font-weight:800;}
  .opt-card .od{font-size:12px;margin-top:3px;opacity:.85;}
  .opt-card .arr{font-size:18px;font-weight:800;}
  .opt-card.gentle{background:var(--primary-l);color:var(--primary);}
  .opt-card.keep{background:#F1ECE2;color:var(--sub2);}
  .opt-card.catch{background:var(--amber-l);color:var(--amber);}
  .settle-foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;}
  .settle-foot .count{font-size:13px;color:var(--sub);font-weight:700;}
  .settle-foot .next{border:none;border-radius:14px;background:var(--primary);color:#fff;padding:12px 22px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}

  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(31,30,27,.42);z-index:60;display:none;align-items:center;justify-content:center;padding:24px;}
  .modal.show{display:flex;}
  .modal .box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:350px;}
  .modal .box h3{margin:0 0 12px;font-size:17px;}
  .modal .box input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;font-family:inherit;margin-bottom:11px;}
  .modal .box .mb{display:flex;gap:9px;}
  .modal .box .mb button{flex:1;border:none;border-radius:11px;padding:12px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;}
  .modal .box .mb .ok{background:var(--primary);color:#fff;}
  .modal .box .mb .no{background:var(--bg);color:var(--sub2);}
  /* 日详情弹窗：纵向列表，内容区可滚动，底部固定 */
  .modal .box.daybox{max-height:85vh;display:flex;flex-direction:column;padding:0;width:calc(100% - 28px);max-width:400px;}
  .modal .box.daybox h3{flex:none;margin:0;padding:16px 18px 12px;font-size:20px;font-weight:700;line-height:1.3;}
  .day-list{flex:1 1 auto;overflow-y:auto;padding:0 18px 6px;-webkit-overflow-scrolling:touch;width:100%;}
  .day-list .section-title{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.3px;margin:14px 0 8px;}
  .day-list .section-title:first-child{margin-top:0;}
  .daybox .mitem{display:flex;align-items:flex-start;gap:10px;font-size:14px;padding:10px 0;border-bottom:1px solid rgba(31,30,27,.06);width:100%;line-height:1.35;}
  .daybox .mitem:last-child{border-bottom:none;}
  .daybox .mitem .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;}
  .daybox .mitem .body{flex:1;min-width:0;}
  .daybox .mitem .body .name{font-size:15px;font-weight:600;word-break:break-word;}
  .daybox .mitem .body .meta{font-size:12px;color:var(--sub);margin-top:2px;font-weight:600;}
  .daybox .mitem .tags{flex:none;display:flex;gap:6px;margin-left:8px;}
  .daybox .mitem .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;}
  .daybox .mitem .tag.must{background:rgba(78,107,87,.12);color:#4E6B57;}
  .daybox .mitem .tag.progress{background:rgba(216,154,62,.16);color:#B07A2E;}
  .daybox .mitem .tag.extra{background:rgba(155,123,201,.14);color:#7E63A8;}
  .daybox .mitem .status{flex:none;font-size:12px;font-weight:800;color:var(--green);margin-left:auto;white-space:nowrap;}
  .daybox .mitem .del{margin-left:auto;color:var(--red);font-size:13px;cursor:pointer;font-weight:700;flex:none;padding:4px 2px;min-width:44px;text-align:center;}
  .day-foot{flex:none;padding:12px 18px 18px;border-top:1px solid var(--line);background:#fff;}
  .day-foot input{margin-bottom:10px;}
  .modal .box.daybox .mb button{flex:1;min-height:44px;font-size:15px;}
  .day-empty{font-size:14px;color:var(--sub);padding:10px 0;}

  /* 转盘弹层 */
  .wheel-layer{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .wheel-layer.show{display:flex;}
  .wheel{width:260px;height:260px;border-radius:50%;background:conic-gradient(var(--primary-l) 0deg 120deg, var(--warm) 120deg 240deg, var(--primary) 240deg 360deg);position:relative;animation:spin 3s ease-out forwards;display:flex;align-items:center;justify-content:center;}
  .wheel .center{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.1);}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(1080deg);}}
  .wheel-result{margin-top:24px;font-size:20px;font-weight:800;}
  .wheel-close{margin-top:20px;border:none;background:var(--primary);color:#fff;border-radius:999px;padding:12px 28px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}

  /* 完成庆祝 + 下一件 */
  .donebox{text-align:center;}
  .donebox .dm-emo{font-size:36px;line-height:1.1;margin-bottom:6px;}
  .donebox h3{margin:0 0 4px;}
  .donebox .dm-sub{font-size:12.5px;color:var(--sub);margin-bottom:12px;}
  .donebox .dm-next{background:var(--primary-l);border-radius:14px;padding:12px 14px;text-align:left;margin-bottom:10px;}
  .donebox .dm-next .lb{font-size:11px;color:var(--primary);font-weight:700;margin-bottom:4px;}
  .donebox .dm-next .tt{font-size:15px;font-weight:800;color:var(--text);}
  .donebox .dm-next .mt{font-size:11.5px;color:var(--sub2);margin-top:4px;}
  .donebox .dm-tip{font-size:11.5px;color:var(--sub);margin-bottom:10px;}
  .donebox .dm-tip b{color:var(--primary);font-weight:800;}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1F1E1B;color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:80;max-width:90%;text-align:center;}
  #toast.show{opacity:.95;}
  .empty{text-align:center;color:var(--sub);padding:34px 20px;font-size:14px;line-height:1.7;}

  /* ============ 点击手感：按下微沉 → 松手浮起回弹 ============ */
  *{-webkit-tap-highlight-color:transparent;}
  .tapable,
  .btn-primary,.btn-row button,.mode-card .switch,.settle-foot .next,.wheel-close,
  .modal .box .mb button,.cal-arrows button,.flow-header .back,
  .tabbar button,.simple-list .item,.today-list .row,.action-list .row,.opt-card,
  .settle-line,.done-fold,.cal-grid .cell,
  .settle-header .later,.daybox .mitem .del{
    transition:transform .2s cubic-bezier(.2,1.3,.4,1),box-shadow .2s ease,filter .18s ease;
    -webkit-user-select:none;user-select:none;
  }
  /* 主按钮：静止时就有一点点悬浮阴影 */
  .btn-primary,.settle-foot .next,.wheel-close,.modal .box .mb .ok{
    box-shadow:0 4px 12px rgba(78,107,87,.20);
  }
  /* 按下：往下沉一点 */
  .tap-press{transform:translateY(2px) scale(.972)!important;filter:brightness(.97);}
  .btn-primary.tap-press,.settle-foot .next.tap-press,.wheel-close.tap-press,
  .modal .box .mb .ok.tap-press{box-shadow:0 1px 4px rgba(78,107,87,.18);}
  /* 圆形小控件按得更深一点 */
  .cal-arrows button.tap-press,.flow-header .back.tap-press,
  .cal-grid .cell.tap-press{transform:scale(.88)!important;}
  /* 整行/整卡片：轻压不缩太多 */
  .simple-list .item.tap-press,.today-list .row.tap-press,.action-list .row.tap-press,
  .opt-card.tap-press,.settle-line.tap-press,
  .done-fold.tap-press{transform:scale(.985)!important;filter:brightness(.975);}

  /* 松手：浮起 + 回弹 */
  @keyframes tapLift{
    0%{transform:translateY(2px) scale(.972);}
    40%{transform:translateY(-5px) scale(1.028);}
    70%{transform:translateY(-1px) scale(1.006);}
    100%{transform:translateY(0) scale(1);}
  }
  @keyframes tapLiftSm{
    0%{transform:scale(.88);}
    45%{transform:translateY(-3px) scale(1.10);}
    75%{transform:translateY(0) scale(.99);}
    100%{transform:scale(1);}
  }
  @keyframes tapLiftRow{
    0%{transform:scale(.985);}
    45%{transform:translateY(-3px) scale(1.012);}
    100%{transform:translateY(0) scale(1);}
  }
  .tap-lift{animation:tapLift .40s cubic-bezier(.3,1.2,.4,1);}
  .cal-arrows button.tap-lift,.flow-header .back.tap-lift,
  .cal-grid .cell.tap-lift{animation:tapLiftSm .38s cubic-bezier(.3,1.3,.4,1);}
  .simple-list .item.tap-lift,.today-list .row.tap-lift,.action-list .row.tap-lift,
  .opt-card.tap-lift,.settle-line.tap-lift,
  .done-fold.tap-lift{animation:tapLiftRow .34s cubic-bezier(.3,1.2,.4,1);}
  /* 底部导航选中项本来就有 on 态，避免动画打架 */
  .tabbar button.tap-lift{animation:tapLiftSm .36s cubic-bezier(.3,1.3,.4,1);}

  @media (hover:hover){
    .btn-primary:hover,.settle-foot .next:hover,.wheel-close:hover{
      transform:translateY(-2px);box-shadow:0 8px 20px rgba(78,107,87,.26);
    }
    .simple-list .item:hover,.today-list .row:hover,.action-list .row:hover,
    .opt-card:hover,.settle-line:hover{transform:translateY(-1px);}
  }
  @media (prefers-reduced-motion:reduce){
    .tap-lift{animation:none;}
    .tap-press{transform:none!important;}
  }

  /* 窄屏顶部：左侧两行问候信息，右侧倒计时；日期独占下一行。 */
  @media screen and (max-width:799px){
    .toprow{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      column-gap:12px;
      row-gap:8px;
      align-items:start;
    }
    .toprow>.greeting{display:contents;}
    .greeting .hello{
      grid-column:1;
      grid-row:1;
      display:grid;
      grid-template-columns:auto auto;
      justify-content:start;
      align-items:center;
      gap:8px;
      margin-top:18px;
      min-width:0;
    }
    .greeting .hello-text{grid-column:1;grid-row:1;}
    .greeting .hello-emoji{grid-column:2;grid-row:1;}
    .greeting .streak-chip{grid-column:1/-1;grid-row:2;justify-self:start;}
    .greeting .sub{grid-column:1/-1;grid-row:2;margin:0;}
    .toprow>.exam-big{grid-column:2;grid-row:1;margin-top:18px;align-self:start;}
  }
  /* 布局语义容器：窄屏不产生额外盒子，保持原单列顺序。 */
  .home-main-grid,.home-side,.cal-layout,.cal-main,.cal-side{display:contents;}

  /* 华为 MatePad Air 横屏：保留手机端结构，扩大内容并利用平板宽度。 */
  @media screen and (orientation:landscape) and (min-width:800px){
    :root{--bottom-nav-height:86px;}
    html,body{min-height:100%;}
    body{
      max-width:none;
      width:100%;
      margin:0;
      padding:0;
    }
    .view{
      max-width:1200px;
      margin:0 auto;
      padding:20px 36px 0;
    }
    #view-home,#view-today,#view-cal,#view-mine{
      padding-bottom:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom) + 32px);
    }
    #view-home{display:none;}
    #view-home.show{display:block;}
    .home-main-grid{
      display:grid;
      grid-template-columns:minmax(0,58fr) minmax(0,42fr);
      gap:24px;
      align-items:stretch;
      margin-bottom:18px;
    }
    .home-main-grid>.focus-card{margin-bottom:0;}
    .home-side{display:flex;flex-direction:column;min-width:0;}
    .home-side>.mode-card{margin-bottom:22px;}
    .home-side>.sec-title{margin:0 0 10px;}
    .home-side>.simple-list{flex:1;margin-bottom:0;}
    #view-today,#view-flow,#view-map{max-width:1100px;}
    #view-cal{max-width:1200px;}
    #view-today .progress-pill{width:100%;max-width:none;}
    .cal-layout{
      display:grid;
      grid-template-columns:minmax(0,52fr) minmax(0,48fr);
      gap:clamp(24px,3vw,32px);
      align-items:start;
    }
    .cal-main,.cal-side{display:block;min-width:0;}
    .cal-main .cal-header{margin-top:0;}
    .cal-main .cal-grid{gap:6px;margin-bottom:16px;}
    .cal-side>.section-title:first-child{margin-top:0;}
    .cal-side .phase{padding:14px 16px;margin-bottom:10px;}
    .cal-side .pending-box .event-card:last-child{margin-bottom:0;}
    #view-mine{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;}
    #view-mine.show{display:grid;}
    #view-mine>.page-title,#view-mine>.stat-card,#view-mine>.timecard,
    #view-mine>.ach-grid,#view-mine>.section-title,#view-mine>.action-list,
    #view-mine>div[style]{grid-column:1/-1;}
    #view-mine>.subj-progress{min-width:0;}
    .page-title{font-size:32px;margin:4px 0 18px;}
    .greeting .hello{font-size:32px;}
    .greeting .sub{font-size:15px;}
    .exam-big{padding:13px 22px;}
    .exam-big .exam-days .num{font-size:30px;}
    .ring-card,.focus-card,.mode-card,.simple-list,.today-list,.active-card,
    .progress-pill,.stat-card,.timecard,.subj-progress,.action-list{box-shadow:0 3px 14px rgba(0,0,0,.035);}
    .ring-card,.focus-card,.mode-card,.progress-pill,.active-card,.stat-card,.timecard,.subj-progress{padding:22px;}
    .focus-card .title{font-size:25px;}
    .simple-list .item,.today-list .row{padding:16px 18px;}

const TDC=(CFG.task_data_contract)||{};
const PRESERVE=(TDC.preserve_on_upsert)||['task_status','actual_minutes','mastery','unfinished_reason','completed_step_ids','history'];
function subjectIdOf(label){
  if(!label)return 'MAJOR';

}
function phaseIdOf(ds){const i=phaseIndexAt(ds);return i>=0?(cfg('phases')[i].phase_id):'';}
function tierOf(layer){if(layer==='必做')return 'MUST';if(layer==='推进')return 'PROGRESS';if(layer==='超额')return 'EXTRA';return layer||'PROGRESS';}
function priorityOf(p){const m={'高':'HIGH','最高':'HIGHEST','中':'MEDIUM','低':'LOW'};return m[p]||'MEDIUM';}
function tierLabel(t){return t==='MUST'?'必做':t==='EXTRA'?'超额':'推进';}
function prioLabel(p){return ({HIGH:'高',HIGHEST:'最高',MEDIUM:'中',LOW:'低'})[p]||'中';}
function hash8(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36).slice(0,8);}
const __seq={};
function resetSeq(){for(const k in __seq)delete __seq[k];}
function nextSeq(ds,subjectId,type){const k=ds+'|'+subjectId+'|'+type;__seq[k]=(__seq[k]||0)+1;return String(__seq[k]).padStart(2,'0');}
function taskIdFor(ds,subjectId,type,seq){return 'KY2027-'+String(ds).replace(/-/g,'')+'-'+subjectId+'-'+type+'-'+seq;}
function calKeyOf(subjectId,type){return subjectId+':'+(type||'TASK');}
/* 步骤：优先 step_key；否则以内容哈希为基，相同文字用出现序号区分 → 内容稳定且同文字不同ID */
function buildSteps(taskId,rawSteps){
  rawSteps=(rawSteps||[]);const seen={};
  return rawSteps.map(raw=>{
    const label=(raw&&typeof raw==='object')?raw.label:raw;
    const skey=(raw&&typeof raw==='object'&&raw.step_key)?raw.step_key:('H'+hash8(String(label==null?'':label)));
    seen[skey]=(seen[skey]||0)+1;const occ=seen[skey];
    return {step_id:taskId+'-S'+skey+'-'+occ,label:(label==null?'':label),status:'PENDING',step_key:(raw&&typeof raw==='object')?raw.step_key:undefined};
  });
}
function stepLabels(steps){return (steps||[]).map(s=>s&&s.label!=null?s.label:s);}
function doneArrFromSteps(steps,completedIds){const c=new Set(completedIds||[]);return (steps||[]).map(s=>c.has(s.step_id));}
function completedIdsFromDone(steps,doneArr){const set=[];(steps||[]).forEach((s,i)=>{if(doneArr&&doneArr[i])set.push(s.step_id);});return set;}
function remapCompletedByBase(steps,oldIds){
  const res=[];(oldIds||[]).forEach(oid=>{const base=String(oid).replace(/-\d+$/,'');const m=steps.find(s=>String(s.step_id).replace(/-\d+$/,'')===base);if(m&&res.indexOf(m.step_id)<0)res.push(m.step_id);});return res;
}
function isOriginAuto(t){return t.task_origin==='GENERATED'||t.task_origin==='RESCHEDULED';}
/* 匹配：有 task_id 只按 task_id；无 task_id 仅当双方都存在非空任务编号时回退；永不比较两个空值 */
function findTaskIndex(tasks,nt){
  if(nt.task_id){const i=tasks.findIndex(t=>t.task_id&&t.task_id===nt.task_id);return i;}
  if(nt['任务编号']){const i=tasks.findIndex(t=>t['任务编号']&&t['任务编号']===nt['任务编号']);if(i>=0)return i;}
  return -1;
}
/* 合并：以 incoming 为模板按 task_id 对齐；保留完成态（按 step_id）、preserve_on_upsert 权威字段与下划线进度 */
function mergePreserve(old,nt){
  const steps=(old.user_modified_steps===true&&Array.isArray(old.steps)&&old.steps.length)
    ?old.steps
    :((nt.steps&&nt.steps.length)?nt.steps:buildSteps(nt.task_id,nt['学习步骤']||[]));
  // 完成集必须从“旧步骤自身”推导（避免顺序变化后位置错位），再按稳定 step_id 映射到新顺序
  const oldSteps=(old.steps&&old.steps.length)?old.steps:buildSteps(old.task_id||old['任务编号']||'',old['学习步骤']||[]);
  let completed;
  if(Array.isArray(old._stepDone)&&old._stepDone.length===oldSteps.length)completed=completedIdsFromDone(oldSteps,old._stepDone);
  else if(Array.isArray(old.completed_step_ids)&&old.completed_step_ids.length)completed=remapCompletedByBase(steps,old.completed_step_ids);
  else if(Array.isArray(old._completedStepIds)&&old._completedStepIds.length)completed=remapCompletedByBase(steps,old._completedStepIds);
  else completed=[];
  const ids=new Set(steps.map(s=>s.step_id));completed=completed.filter(id=>ids.has(id));
  const _stepDone=doneArrFromSteps(steps,completed);
  const merged=Object.assign({},nt);
  merged.steps=steps;merged.completed_step_ids=completed;merged._stepDone=_stepDone;
  const prog={};Object.keys(old).forEach(k=>{if(k[0]==='_'&&k!=='_stepDone'&&k!=='_done')prog[k]=old[k];});Object.assign(merged,prog);
  merged._stepDone=_stepDone;
  merged._done=(steps.length>0&&_stepDone.every(Boolean)); // 由完成集派生，避免旧 _done 覆盖
  PRESERVE.forEach(k=>{if(old[k]!==undefined)merged[k]=old[k];});
  // 完成态一致性：全部步骤完成 → COMPLETED；否则若被误标 COMPLETED 则降为 IN_PROGRESS
  if(merged._done && merged.task_status!=='RESCHEDULED') merged.task_status='COMPLETED';
  else if(!merged._done && merged.task_status==='COMPLETED') merged.task_status='IN_PROGRESS';
  merged['学习步骤']=stepLabels(steps);
  merged['任务编号']=merged.task_id;
  merged['科目']=nt['科目']||old['科目'];
  merged['日期']=merged.scheduled_date;
  merged['层']=tierLabel(merged.tier);
  merged['预计时间']=merged.estimated_minutes;
  merged['优先级']=prioLabel(merged.priority);
  merged['任务成果']=merged.outcome;
  merged['起步动作']=merged.first_action;
  merged['复习阶段']=nt['复习阶段']||old['复习阶段'];
  merged['章节']=nt['章节']||old['章节'];
  merged['配套资料']=nt['配套资料']||old['配套资料']||'';
  merged['任务类型']=merged['层'];
  merged['重复规则']=nt['重复规则']||old['重复规则']||'无';
  merged['下次复习日期']=nt['下次复习日期']||old['下次复习日期']||'';
  return merged;
}
function mergeTasks(incoming){
  const tasks=load();let added=0,updated=0;
  incoming.forEach(nt=>{
    if(!nt||(!nt.task_id&&!nt['任务编号']))return;
    const idx=findTaskIndex(tasks,nt);
    if(idx>=0){tasks[idx]=mergePreserve(tasks[idx],nt);updated++;}
    else{
      if(typeof nt._done==='undefined')nt._done=false;
      if(!Array.isArray(nt._stepDone))nt._stepDone=(nt.steps||nt['学习步骤']||[]).map(()=>false);
      if(typeof nt._current==='undefined')nt._current=0;
      if(typeof nt._time==='undefined')nt._time=0;
      tasks.push(nt);added++;
    }
  });
  save(tasks);
  return {added,updated};
}

/* 历史用时校准（严格按 CFG.calibration）：按独立 calibration_key（科目+任务类型），
   只统计真正完成(COMPLETED)的逻辑任务；续做片段按 root_task_id 累加(非取最大)；
   按完成时间取最近3个逻辑任务；用中位数；钳制到模板原预计 50%~150% */
function getCalSamples(calKey){
  if(!calKey)return [];
  const all=load();
  const done=all.filter(x=>x.calibration_key===calKey && x.task_status==='COMPLETED' && (x.actual_minutes>0));
  const byRoot={};
  done.forEach(x=>{const rk=x.root_task_id||x.task_id;byRoot[rk]=(byRoot[rk]||0)+(x.actual_minutes||0);});
  const logs=Object.keys(byRoot).map(rk=>{
    const x=done.find(d=>(d.root_task_id||d.task_id)===rk);
    const h=(x.history&&x.history.length)?x.history[x.history.length-1]:null;
    const ctime=(h&&h.date)?h.date:(x['日期']||'');
    return {minutes:byRoot[rk],ctime:ctime};
  });
  logs.sort((a,b)=>a.ctime<b.ctime?1:(a.ctime>b.ctime?-1:0)); // 最近完成优先
  return logs.slice(0,3).map(l=>l.minutes);
}
function median(arr){
  if(!arr||!arr.length)return null;
  const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);
  return s.length%2?s[m]:((s[m-1]+s[m])/2);
}
function getAvgTimeByCalKey(calKey,defaultMin){
  const samples=getCalSamples(calKey);
  if(!samples.length)return null;
  const med=median(samples);
  if(defaultMin==null)return med;
  const lo=Math.round(defaultMin*0.5),hi=Math.round(defaultMin*1.5);
  return Math.max(lo,Math.min(hi,Math.round(med)));
}
function estimateMinutes(t){
  if(!t)return null;
  const ck=calKeyOf(t.subject_id||subjectIdOf(t['科目']), t.task_type||((t.task_id||'').split('-')[4])||'TASK');
  return getAvgTimeByCalKey(ck, t.estimated_minutes||t['预计时间']);
}
function getAvgTimeBySuffix(suffix){return null;}
function calibrateMin(subj,layer,suffix,defaultMin){
  const ck=calKeyOf(subjectIdOf(subj),suffix);
  const avg=getAvgTimeByCalKey(ck,defaultMin);
  if(!avg)return defaultMin;
  return avg;
}

function occSince(subj,a,b){let n=0,d=parse(a);const e=parse(b);while(d<=e){if(mainSubject(d)===subj)n++;d=addDays(d,1);}return n;}
const P1STEPS=['打开「[章]」对应PPT/342视频','通读本章教材并看视频','整理章节框架笔记','标记重点(结构/波谱/鉴别)','完成章节自测'];
const P2STEPS=['背诵一轮笔记「[章]」','做「[章]」对应习题','核对答案并标注错题','把真题考点标到笔记'];
const P3STEPS=['滚动背「[章]」高频考点','做「[章]」大题/真题','回看错题本对应点'];
const P4STEPS=['快速过「[章]」核心框架','背高频考点与易混点'];
function mainTask(ds,subj,ph){
  const chs=CHAPTERS[subj];
  if(!chs) return mk(ds,'MAJ',subj,ph.name,'A4框架思维导图',70,'高','必做','通读本章并画框架','打开本章教材',['打开教材','通读','画框架','补细节','编口诀'],'艾宾浩斯2/4/8');
  const startDs=fmt(ph.start);
  const endD = ph.end.getTime()>EXAM.getTime()?EXAM:ph.end;
  const endStr=fmt(endD);
  const k=occSince(subj,startDs,ds)-1;
  let win;
  if(ph.key==='P4'){
    const hot=chs.map((c,i)=>i).filter(i=>chs[i].hot);
    const len=hot.length||chs.length;
    win=[hot.length?hot[((k%len)+len)%len]:(k%chs.length)];
  } else {
    const total=occSince(subj,startDs,endStr);
    const C=chs.length, base=Math.floor(C/total), extra=C%total;
    let s=0; for(let i=0;i<k;i++) s+=base+(i<extra?1:0);
    const size=base+(k<extra?1:0);
    win=[]; for(let i=s;i<s+size&&i<C;i++) win.push(i);
    if(win.length===0) win=[Math.min(Math.max(k,0),C-1)];
  }
  const tk=c=>c.no===0?'绪论':('第'+c.no+'章');
  const chTitle = win.length===1 ? chs[win[0]].n : (tk(chs[win[0]])+'–'+tk(chs[win[win.length-1]]));
  const resPick = ph.key==='P1'?'r1':ph.key==='P2'?'r2':ph.key==='P3'?'r3':'r4';
  const res = chs[win[0]][resPick]||'';
  const durBase = win.reduce((a,i)=>a+(chs[i].dur||60),0);
  const dur = ph.key==='P1'?durBase : ph.key==='P2'?Math.max(20,Math.round(durBase*0.7)) : ph.key==='P3'?Math.max(15,Math.round(durBase*0.6)) : 30;
  const tpl = ph.key==='P1'?P1STEPS : ph.key==='P2'?P2STEPS : ph.key==='P3'?P3STEPS : P4STEPS;
  const steps = tpl.map(s=>s.replace(/\[章\]/g,chTitle));
  const act = ph.key==='P1'?'理解并整理「'+chTitle+'」笔记' : ph.key==='P2'?'背诵「'+chTitle+'」并做习题' : ph.key==='P3'?'真题冲刺「'+chTitle+'」' : '维稳速过「'+chTitle+'」高频点';
  const outcome = act;
  const start = '打开「'+chTitle+'」对应PPT/视频与资料';
  return mk(ds,'MAJ',subj,ph.name,chTitle,dur,'高','必做',outcome,start,steps,'艾宾浩斯2/4/8',res);
}

function saveArch(a){localStorage.setItem(KEY_ARCH,JSON.stringify(a));}
/* 识别自动任务：优先按 task_origin；兼容旧版 D…/R…/ _resched_ 编号 */
function isAutoTask(t){
  if(t.task_origin==='GENERATED'||t.task_origin==='RESCHEDULED')return true;
  const id=t['任务编号']||'';
  if(id.indexOf('_resched_')===0) return true;
  if(id.charAt(0)==='R') return true;
  if(/^D\d{4}-\d{2}-\d{2}-/.test(id)) return true;
  return false;
}
/* 切换到滚动7天时，先自动备份，再把"旧自动生成且未开始且超出7天"的任务归档，保留已完成/手动/提醒/历史 */
function migrateToRolling7(){
  if(localStorage.getItem(KEY_MIG))return; // 已迁移，防重复执行
  const tasks=load();
  const horizon=addDays(today(),6);
  // 1) 自动保存一次完整备份（本地快照）
  const backup={version:3,reason:'rolling7_migration',ts:fmt(today()),
    tasks:tasks,marks:loadMarks(),easy:easyToday(),gentle:loadGentleCount(),
    streak:loadStreakDates(),timelog:loadTimeLog()};
  try{localStorage.setItem('qichengtai_backup_pre_rolling7_'+fmt(today()),JSON.stringify(backup));}catch(e){}
  // 2) 归档：自动生成 且 日期>今天+6 且 未完成 且 无已勾步骤
  const arch=[];const keep=[];
  tasks.forEach(x=>{
    const done=x._done||isDone(x);
    const sd=x['_stepDone']||(x['学习步骤']||[]).map(()=>false);
    const anyStep=sd.some(Boolean);
    const beyond=parse(x['日期'])>horizon;
    if(isAutoTask(x)&&beyond&&!done&&!anyStep)arch.push(x);
    else keep.push(x);
  });
  if(arch.length>0){ saveArch(loadArch().concat(arch)); save(keep); }
  localStorage.setItem(KEY_MIG,'1');
  window.__migrated={archived:arch.length};
}

/* ============ 阶段2：稳定 ID 迁移（v2，可修复 v1 数据，幂等） ============ */
function normalizeTask(t){
  if(!t)return t;
  const hasStepsObj=Array.isArray(t.steps)&&t.steps.length>0&&t.steps[0]&&typeof t.steps[0]==='object'&&t.steps[0].step_id;
  if(t.task_id&&hasStepsObj&&Array.isArray(t.completed_step_ids)){
    // 已是 v2 形态：仅补缺失兼容/权威字段，保留 steps 与 completed_step_ids
    const nt=Object.assign({},t);
    if(!nt.schema_version)nt.schema_version=CFG.schema_version;
    if(!nt.task_type)nt.task_type=(nt.task_id||'').split('-')[4]||'TASK';
    if(!nt.task_status)nt.task_status=(nt.steps.length>0&&nt._stepDone.every(Boolean))?'COMPLETED':'PLANNED';
    if(!nt.task_origin)nt.task_origin=isAutoTask(nt)?'GENERATED':'MANUAL';
    if(!nt.calibration_key)nt.calibration_key=calKeyOf(nt.subject_id||subjectIdOf(nt['科目']),nt.task_type);
    if(!nt.history)nt.history=[];
    if(nt.actual_minutes==null)nt.actual_minutes=Math.round((nt._time||0)/60);
    if(!nt['学习步骤'])nt['学习步骤']=stepLabels(nt.steps);
    if(!nt['任务编号'])nt['任务编号']=nt.task_id;
    if(!nt['日期'])nt['日期']=nt.scheduled_date;
    if(!nt['层'])nt['层']=tierLabel(nt.tier);
    if(!nt['预计时间'])nt['预计时间']=nt.estimated_minutes;
    if(!nt['优先级'])nt['优先级']=prioLabel(nt.priority);
    if(!nt['任务成果'])nt['任务成果']=nt.outcome;
    if(!nt['起步动作'])nt['起步动作']=nt.first_action;
    if(!nt['复习阶段'])nt['复习阶段']=nt.phase_id;
    if(!nt['章节'])nt['章节']='';
    if(!nt['配套资料'])nt['配套资料']='';
    if(!nt['任务类型'])nt['任务类型']=nt['层'];
    if(!nt['重复规则'])nt['重复规则']='无';
    if(!nt['下次复习日期'])nt['下次复习日期']='';
    // 完成态一致性（阻断修复#6）：completed_step_ids 为权威来源，_stepDone/_done 一律由其派生，
    // 旧的 _stepDone/_done 即便与完成集矛盾也不得覆盖；task_status 必须与“全步骤完成”一致
    nt._stepDone=doneArrFromSteps(nt.steps,nt.completed_step_ids);
    nt._done=(nt.steps.length>0&&nt._stepDone.every(Boolean));
    if(nt._done && nt.task_status!=='RESCHEDULED') nt.task_status='COMPLETED';
    else if(!nt._done && nt.task_status==='COMPLETED') nt.task_status='IN_PROGRESS';
    return nt;
  }
  // 需要完整规范化（原版 / v1 数据）
  const ds=t['日期']||t.scheduled_date||'';
  const subj=t['科目']||(t.subject_id?subjLabelOf(t.subject_id):'');
  const subjectId=t.subject_id||subjectIdOf(subj);
  let type;
  if(t.task_id){const p=t.task_id.split('-');type=p[4]||'TASK';}
  else{const id=t['任务编号']||'';if(id.charAt(0)==='R')type='RR';else{const parts=id.split('-');type=parts.length?parts[parts.length-1]:'TASK';}}
  const seq=nextSeq(ds,subjectId,type);
  const taskId=t.task_id||taskIdFor(ds,subjectId,type,seq);
  let labels=t['学习步骤']||(t.steps?stepLabels(t.steps):[]);
  let stepObjs=hasStepsObj?t.steps:buildSteps(taskId,labels);
  let completed;
  if(Array.isArray(t._stepDone)&&t._stepDone.length===stepObjs.length)completed=completedIdsFromDone(stepObjs,t._stepDone);
  else if(Array.isArray(t.completed_step_ids)&&t.completed_step_ids.length)completed=remapCompletedByBase(stepObjs,t.completed_step_ids);
  else if(Array.isArray(t._completedStepIds)&&t._completedStepIds.length)completed=remapCompletedByBase(stepObjs,t._completedStepIds);
  else completed=[];
  const ids=new Set(stepObjs.map(s=>s.step_id));completed=completed.filter(id=>ids.has(id));
  const _stepDone=doneArrFromSteps(stepObjs,completed);
  let status=t.task_status;
  if(!status){
    if(t._from||t.root_task_id||(taskId.indexOf('-RR-')>=0))status='RESCHEDULED';
    else status='PLANNED';
  }
  if(stepObjs.length>0 && _stepDone.every(Boolean)) status='COMPLETED';
  else if(status==='COMPLETED') status='IN_PROGRESS';
  let origin=t.task_origin;
  if(!origin){
    if(status==='RESCHEDULED')origin='RESCHEDULED';
    else if(isAutoTask(t)||/^D\d{4}-\d{2}-\d{2}-/.test(t['任务编号']||'')||/^KY2027-/.test(t.task_id||''))origin='GENERATED';
    else origin='MANUAL';
  }
  const tier=t.tier||tierOf(t['层']||'推进');
  const ttype=t.task_type||(taskId||'').split('-')[4]||'TASK';
  const calKey=t.calibration_key||calKeyOf(subjectId,ttype);
  const nt={
    task_id:taskId,schema_version:CFG.schema_version,
    subject_id:subjectId,task_type:ttype,phase_id:t.phase_id||phaseIdOf(ds),scheduled_date:ds,
    tier:tier,priority:t.priority||priorityOf(t['优先级']||'中'),
    outcome:t.outcome||t['任务成果']||'',first_action:t.first_action||t['起步动作']||'',
    estimated_minutes:t.estimated_minutes||t['预计时间']||30,
    steps:stepObjs,task_status:status,task_origin:origin,
    actual_minutes:(t.actual_minutes!=null)?t.actual_minutes:Math.round((t._time||0)/60),
    completed_step_ids:completed,history:t.history||[],
    calibration_key:calKey,
    mastery:t.mastery||null,unfinished_reason:t.unfinished_reason||(status==='RESCHEDULED'?'NOT_FINISHED':null),
    root_task_id:t.root_task_id||(status==='RESCHEDULED'?(t._from||t['任务编号']):null),
    source_task_id:t.source_task_id||(status==='RESCHEDULED'?(t._from||t['任务编号']):null),
    user_modified_steps:!!t.user_modified_steps,
    任务编号:taskId,科目:subj,复习阶段:t['复习阶段']||phaseIdOf(ds),章节:t['章节']||'',
    日期:ds,预计时间:t.estimated_minutes||t['预计时间']||30,优先级:t['优先级']||prioLabel(t.priority)||'中',
    任务类型:t['层']||tier,任务成果:t.outcome||t['任务成果']||'',起步动作:t.first_action||t['起步动作']||'',
    学习步骤:stepLabels(stepObjs),重复规则:t['重复规则']||'无',下次复习日期:t['下次复习日期']||'',层:t['层']||tier,配套资料:t['配套资料']||'',
    _done:(stepObjs.length>0&&_stepDone.every(Boolean)),
    _stepDone:_stepDone,_current:(t._current||0),_time:(t._time||0),_from:t._from||null
  };
  return nt;
}
const KEY_MIG2='qichengtai_stable_ids_v2';
/* 迁移前建立完整独立快照（任何写入之前），异常时不写完成标记 */
function takeBackupV2(ts){
  try{
    const snap={
      ts:ts,
      tasks:load(),
      archived:loadArch(),
      focus:localStorage.getItem(KEY_FOCUS),
      marks:loadMarks(),
      timelog:loadTimeLog(),
      streak:localStorage.getItem(KEY_STREAK),
      easy:easyToday(),
      gentle:loadGentleCount()
    };
    localStorage.setItem('qichengtai_backup_pre_stableids_v2_'+ts, JSON.stringify(snap));
    return true;
  }catch(e){ return false; }
}
/* 把重复 task_id 重分配为确定性唯一 id，并同步 step_id/任务编号；保留各自进度 */
function retaskIds(t,oldId,newId){
  t.task_id=newId;
  t['任务编号']=newId;
  if(Array.isArray(t.steps)){
    t.steps=t.steps.map((s,i)=>{
      const base=(s.step_key)?s.step_key:('H'+hash8(''+(s.label==null?'':s.label)));
      const ns=Object.assign({},s);ns.step_id=newId+'-S'+base+'-'+(i+1);return ns;
    });
  }
  if(Array.isArray(t.completed_step_ids)){
    t.completed_step_ids=t.completed_step_ids.map(cid=>cid.indexOf(oldId)===0?newId+cid.slice(oldId.length):cid);
  }
}
/* 扫描重复 task_id 并确定性重分配；更新 idMap（旧标识→规范 id，避免引用悬空） */
function dedupeIds(list,idMap){
  const seen={};
  list.forEach(t=>{
    const id=t.task_id;
    if(!id)return;
    if(seen[id]){
      const p=id.split('-');const p1=p[1]||'';const subj=p[2]||'MAJOR';const type=p[3]||'TASK';
      let n=parseInt(p[4]||'1',10)||1;let newId;
      do{ n++; newId='KY2027-'+p1+'-'+subj+'-'+type+'-'+String(n).padStart(2,'0'); }while(seen[newId]);
      const oldId=id;
      retaskIds(t,oldId,newId);
      seen[newId]=true;
      Object.keys(idMap).forEach(k=>{ if(k!==oldId && idMap[k]===oldId) idMap[k]=newId; });
    } else {
      seen[id]=true;
    }
  });
}
function migrateStableIdsV2(){
  if(localStorage.getItem(KEY_MIG2))return; // 已迁移，防重复执行（幂等）
  const ts=String(Date.now());
  takeBackupV2(ts); // 写入结果前先完整备份
  try{
    const tasks=load(), arch=loadArch();
    resetSeq();
    const idMap={}; // 原始标识(任务编号/旧task_id) → 规范化后 task_id
    const normTasks=tasks.map(t=>{
      const o=t['任务编号']||t.task_id, nt=normalizeTask(t);
      if(o&&o!==nt.task_id)idMap[o]=nt.task_id;
      if(t.task_id&&t.task_id!==nt.task_id)idMap[t.task_id]=nt.task_id;
      return nt;
    });
    const normArch=arch.map(t=>{
      const o=t['任务编号']||t.task_id, nt=normalizeTask(t);
      if(o&&o!==nt.task_id)idMap[o]=nt.task_id;
      if(t.task_id&&t.task_id!==nt.task_id)idMap[t.task_id]=nt.task_id;
      return nt;
    });
    dedupeIds(normTasks,idMap);
    dedupeIds(normArch,idMap);
    [...normTasks, ...normArch].forEach(t=>{
      if(t._from && idMap[t._from]) t._from=idMap[t._from];
      if(t.root_task_id && idMap[t.root_task_id]) t.root_task_id=idMap[t.root_task_id];
      if(t.source_task_id && idMap[t.source_task_id]) t.source_task_id=idMap[t.source_task_id];
    });
    save(normTasks);
    if(normArch.length) saveArch(normArch);
    migrateFocusRef(idMap);
    localStorage.setItem(KEY_MIG2,'1');
  }catch(e){
    // 异常：绝不写迁移完成标记，保留备份供恢复
    if(typeof console!=='undefined' && console.error) console.error('migrateStableIdsV2 failed', e);
  }
}
function migrateFocusRef(idMap){
  try{
    const s=JSON.parse(localStorage.getItem(KEY_FOCUS)||'{}');
    let changed=false;
    Object.keys(s).forEach(d=>{const id=s[d];if(id&&idMap[id]){s[d]=idMap[id];changed=true;}});
    if(changed)localStorage.setItem(KEY_FOCUS,JSON.stringify(s));
  }catch(e){}
}
function ensureRolling(){
  // 生成起点取“今天”与“计划开始日”中较晚者，避免早于8月1日产生任务
  const planStart=parse(CFG.plan.study_start_date);
  const planEnd=parse(CFG.plan.study_end_date);
  const t=today();
  const start=t<planStart?planStart:t;
  // 滚动范围上限：min(起点+6天, 计划结束日) —— 不得生成 study_end_date 之后的新复习任务
  const hardEnd=(planEnd<addDays(start,6))?planEnd:addDays(start,6);
  const all=[];
  resetSeq();
  let d=new Date(start);
  while(d<=hardEnd){
    all.push(...buildDayPlan(d));
    d=addDays(d,1);
  }
  rescheduleYesterday(all);
  return mergeTasks(all);
}
function rescheduleYesterday(batch){
  const t=today(),ys=fmt(addDays(t,-1)),ts=fmt(t);
  const tasks=load();
  if(tasks.some(x=>x['任务编号']==='_resched_'+ts))return;
  const yUnfin=tasks.filter(x=>x['日期']===ys&&(x['层']==='必做'||x['层']==='推进')&&!x._done);
  yUnfin.forEach(o=>{
    const steps=o['学习步骤']||[];const sd=o['_stepDone']||steps.map(()=>false);
    const remainIdx=[];for(let i=0;i<steps.length;i++)if(!sd[i])remainIdx.push(i);
    if(remainIdx.length===0)return;
    const remainRaw=(o.steps&&o.steps.length)?remainIdx.map(i=>o.steps[i]):remainIdx.map(i=>({label:steps[i]}));
    const remainLabels=remainRaw.map(s=>s.label!=null?s.label:s);
    const done=sd.filter(Boolean).length;const ratio=steps.length?done/steps.length:0;
    const layer=ratio>=0.5?'推进':'必做';
    const subjectId=subjectIdOf(o['科目']);
    const seq=nextSeq(ts,subjectId,'RR');
    const taskId=taskIdFor(ts,subjectId,'RR',seq);
    const st=buildSteps(taskId,remainRaw);
    const remainMinutes=Math.max(15,Math.round((o['预计时间']||30)*remainIdx.length/steps.length));
    const tier=tierOf(layer);
    const obj={
      task_id:taskId,schema_version:CFG.schema_version,
      subject_id:subjectId,phase_id:phaseIdOf(ts),scheduled_date:ts,
      tier:tier,priority:o['优先级']?priorityOf(o['优先级']):'MEDIUM',
      outcome:'继续：'+o['任务成果'],first_action:'继续昨天：'+o['起步动作'],estimated_minutes:remainMinutes,
      steps:st,task_status:'RESCHEDULED',task_origin:'RESCHEDULED',
      actual_minutes:0,completed_step_ids:[],history:[],
      calibration_key:calKeyOf(subjectId,tier),
      root_task_id:o.task_id||o['任务编号'],source_task_id:o.task_id||o['任务编号'],
      unfinished_reason:o.unfinished_reason||'NOT_FINISHED',
      任务编号:taskId,科目:o['科目'],复习阶段:o['复习阶段'],章节:'（续）'+o['章节'],
      日期:ts,预计时间:remainMinutes,优先级:o['优先级']||'中',任务类型:layer,
      任务成果:'继续：'+o['任务成果'],起步动作:'继续昨天：'+o['起步动作'],
      学习步骤:remainLabels,重复规则:'无',下次复习日期:'',层:layer,配套资料:o['配套资料']||'',
      _done:false,_stepDone:st.map(()=>false),_current:0,_time:0,_from:o['任务编号']
    };
    batch.push(obj);
  });
  batch.push({任务编号:'_resched_'+ts,日期:ts,隐藏:true});
}

/* ============ 渲染工具 ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tasksOfDate(ds){return load().filter(t=>t['日期']===ds&&!t['隐藏']);}
function doneCount(t){const sd=t['_stepDone']||(t['学习步骤']||[]).map(()=>false);return sd.filter(Boolean).length;}
function totalSteps(t){return (t['学习步骤']||[]).length;}
function isDone(t){
  const steps=t['学习步骤']||[];
  if(steps.length===0)return !!t._done;
  const sd=t['_stepDone']||steps.map(()=>false);
  return sd.every(Boolean);
}
/* 进度环：绿色填充=已完成的步骤，浅灰轨道=未完成，环不满即这件还没做完 */
function ringSvg(done,total){
  const C=151;
  const dLen=total?Math.round(C*done/total):0;
  return `<svg class="ring" viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="24"/>`+
    `<circle class="fill" cx="28" cy="28" r="24" style="stroke-dasharray:${dLen} ${C};stroke-dashoffset:0"/></svg>`;
}
/* 某天「任务全部完成」= 当天所有非超额、未隐藏任务都已 done（至少有一条才算） */
function dayComplete(ds,tasks){
  const ts=tasks.filter(t=>t['日期']===ds&&!t['隐藏']&&t['层']!=='超额');
  if(ts.length===0)return false;
  return ts.every(t=>isDone(t));
}
function star(p){return p==='高'||p==='最高'?'<span class="chip star">'+ic('star','warm')+' 高优先级</span>':'';}
function fmtTime(sec){const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');return m+':'+s;}

const KEY_FOCUS='qichengtai_focus';
function saveHomeFocus(){try{const s=JSON.parse(localStorage.getItem(KEY_FOCUS))||{};s[fmt(today())]=homeFocusId||'';localStorage.setItem(KEY_FOCUS,JSON.stringify(s));}catch(e){}}
function loadHomeFocus(){try{const s=JSON.parse(localStorage.getItem(KEY_FOCUS))||{};return s[fmt(today())]||null;}catch(e){return null;}}

/* 动态问候语：按 CFG.plan.timezone（默认 Asia/Shanghai）取时区内的分钟数，映射到问候语+emoji */
function greetingTimezone(){
  let tz='Asia/Shanghai';
  try{ if(typeof CFG!=='undefined' && CFG.plan && CFG.plan.timezone) tz=CFG.plan.timezone; }catch(e){}
  return tz;
}
function minuteInTz(tz){
  try{
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',hour12:false,minute:'2-digit'}).formatToParts(new Date());
    let h=0,m=0;
    parts.forEach(p=>{ if(p.type==='hour')h=parseInt(p.value,10)||0; if(p.type==='minute')m=parseInt(p.value,10)||0; });
    if(h===24)h=0;
    return h*60+m;
  }catch(e){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
}
function greetingFor(min){
  if(min>=300 && min<=539) return {text:'早上好',emoji:'🐣'};
  if(min>=540 && min<=689) return {text:'上午好',emoji:'🌱'};
  if(min>=690 && min<=839) return {text:'中午好',emoji:'🍙'};
  if(min>=840 && min<=1079) return {text:'下午好',emoji:'🌞'};
  if(min>=1080 && min<=1379) return {text:'晚上好',emoji:'🌙'};
  return {text:'夜深了',emoji:'✨'};
}
function computeGreeting(){ return greetingFor(minuteInTz(greetingTimezone())); }
/* 只更新问候文字与 emoji，不重生成首页任务 */
function updateGreeting(){
  const el=document.getElementById('hello-text');
  const em=document.getElementById('hello-emoji');
  if(!el||!em)return;
  const g=computeGreeting();
  if(el.textContent!==g.text)el.textContent=g.text;
  if(em.textContent!==g.emoji)em.textContent=g.emoji;
}

function renderHome(){
  const t=today(),ds=fmt(t);
  const all=tasksOfDate(ds);
  const must=all.filter(x=>x['层']==='必做');
  const push=all.filter(x=>x['层']==='推进');
  const mustDone=must.filter(isDone).length;
  const tasksAll=isEasy()?must.slice(0,1):must.concat(push);
  const tSteps=tasksAll.reduce((a,b)=>a+totalSteps(b),0);
  const tDone=tasksAll.reduce((a,b)=>a+doneCount(b),0);

  const names=['日','一','二','三','四','五','六'];
  const examDiff=Math.ceil((EXAM-t)/86400000);

  const streak=calcStreak();

 if(homeFocusId)focus=all.find(x=>taskMatchesId(x,homeFocusId)&&!isDone(x)&&x['层']!=='超额');

  }
  homeFocusId=focus?focus['任务编号']:null;

  // 接下来
  let next=[];
  if(focus)next=must.filter(x=>x['任务编号']!==focus['任务编号']&&!isDone(x));

  let html='<div class="toprow">';

  html+=`<div class="exam-big">
    <div class="exam-label">考研</div>
    <div class="exam-days"><span class="num">${examDays}</span> ${examSuffix}</div>
  </div></div>`;

  html+=`<div class="ring-card">
    ${ringSvg(tDone,tSteps)}
    <div class="ring-txt"><div class="top">复习一小步，考研一大步</div>
      <div class="big">今天完成 <span class="num">${tDone}</span> / <span class="num">${tSteps}</span> 步</div></div>
    <button class="map-btn" onclick="openMap()">${ic('map','greenLine')}<span>作战<br>地图</span></button>
  </div>`;

  html+='<div class="home-main-grid">';

  if(focus){
    html+=`<div class="focus-card">
      <div class="lab">现在最适合做这一件</div>
      <div class="title">${esc(focus['章节'])}</div>
      <div class="meta">
        <span class="chip">${esc(focus['科目'])}</span>
        <span class="chip">约 ${esc(focus['预计时间'])} 分钟</span>
        ${focus['优先级']==='高'||focus['优先级']==='最高'?'<span class="chip star">'+ic('star','warm')+' 高优先级</span>':''}
      </div>
      <div class="desc">${esc(focus['任务成果'])}</div>
      <div class="focus-bar">
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <div class="info"><span>今日进度</span><span class="num">${pct}%</span></div>
      </div>
      <button class="btn-primary" onclick="openFlow('${esc(focus['任务编号'])}')">开始 →</button>
      <div class="btn-row">
        <button onclick="shuffleFocus()">换一个</button>
        <button onclick="spinWheel()">${ic('target','green')} 转盘帮我选</button>
      </div>
    </div>`;
  }else{
    html+=`<div class="focus-card"><div class="desc">今天没有必做任务，好好休息或看看推进项 ${ic('leaf','green')}</div></div>`;
  }

  html+='<div class="home-side">';
  const easy=isEasy();
  html+=`<div class="mode-card ${easy?'on':''}" onclick="toggleEasy()">
    <div class="tx">今天状态不好？<small>切到最低目标，今天只做 1 件事</small></div>
    <button class="switch">${easy?'已切换':'切换'}</button>
  </div>`;

  if(next.length>0 && !easy){
    html+=`<div class="sec-title">接下来</div><div class="simple-list">`;
    next.forEach(x=>{
      html+=`<div class="item" onclick="openFlow('${esc(x['任务编号'])}')">
        <span class="dot"></span>
        <div class="body">${esc(x['科目'])} · ${esc(shortOutcome(x))}</div>
        <div class="time"><span class="num">${esc(x['预计时间'])}</span> 分钟</div>
      </div>`;
    });
    html+=`</div>`;
  }
  html+='</div></div>';
  document.getElementById('view-home').innerHTML=html;
  updateGreeting();
  saveHomeFocus();
}
function shortOutcome(t){const o=t['任务成果']||'';return o.length>18?o.slice(0,18)+'…':o;}
// 自动挑下一件：未完成的必做优先（专业课优先），其次推进项；低负荷模式只看必做
function pickFocus(exclude){
  const ds=fmt(today());
  const all=tasksOfDate(ds).filter(x=>!isDone(x)&&x['任务编号']!==exclude);
  const must=all.filter(x=>x['层']==='必做');
  const push=all.filter(x=>x['层']==='推进');
  const pool=isEasy()?must:must.concat(push);
  return pool.find(x=>subjType(x['科目'])==='green')||pool[0]||null;
}
function toggleEasy(){setEasy(!isEasy());renderHome();renderToday();toast(isEasy()?'已切换到低负荷模式，今天只做1件事':'已恢复正常模式');}
function shuffleFocus(){
  const ds=fmt(today());
  const candidates=tasksOfDate(ds).filter(x=>x['层']!=='超额'&&!isDone(x)&&x['任务编号']!==homeFocusId);
  if(candidates.length===0){toast('这已经是今天最合适的啦');return;}
  const pick=candidates[Math.floor(Math.random()*candidates.length)];
  homeFocusId=pick['任务编号'];
  saveHomeFocus();
  renderHome();
  toast('已换一件：'+pick['章节']);
}

/* 转盘 */
let wheelTaskId=null;
const WHEEL_COLORS=['var(--primary-l)','var(--green-l)','var(--warm)','var(--amber-l)','var(--blue-l)','var(--yellow-l)','var(--red-l)','var(--primary-light)','var(--line)'];
function wheelGradient(n){
  const a=360/n;let s='conic-gradient(';
  for(let i=0;i<n;i++){
    s+=`${WHEEL_COLORS[i%WHEEL_COLORS.length]} ${i*a}deg ${(i+1)*a}deg`+(i<n-1?', ':'');
  }
  return s+')';
}
function spinWheel(){
  const ds=fmt(today());const all=tasksOfDate(ds).filter(x=>x['层']!=='超额'&&!isDone(x));
  if(all.length===0){toast('今天没有待选任务');return;}
  const pick=all[Math.floor(Math.random()*all.length)];
  wheelTaskId=pick['任务编号'];
  const wheel=document.getElementById('wheel');
  wheel.style.background=wheelGradient(Math.max(9,all.length));
  wheel.style.animation='none';void wheel.offsetWidth;wheel.style.animation='';
  document.getElementById('wheelLayer').classList.add('show');
  document.getElementById('wheelResult').textContent='转盘转呀转…';
  setTimeout(()=>{
    document.getElementById('wheelResult').innerHTML='就它啦：<br><b>'+esc(pick['章节'])+'</b>';

function closeWheel(){
  document.getElementById('wheelLayer').classList.remove('show');

}

/* ============ 今日（三分层） ============ */
function renderToday(){
  const t=today(),ds=fmt(t);
  const all=tasksOfDate(ds);
  const easyMode=isEasy();
  let must=all.filter(x=>x['层']==='必做');
  if(easyMode)must=must.slice(0,1);
  const push=easyMode?[]:all.filter(x=>x['层']==='推进');
  const extra=all.filter(x=>x['层']==='超额');
  const mustDone=must.filter(isDone).length;
  const extraUnlocked=must.length>0&&mustDone===must.length;

  const totalStepsAll=must.concat(push).reduce((a,b)=>a+totalSteps(b),0);
  const doneStepsAll=must.concat(push).reduce((a,b)=>a+doneCount(b),0);
  const pct=totalStepsAll?Math.round(doneStepsAll/totalStepsAll*100):0;

  let html='<div class="page-title">今日</div>';

  html+=`<div class="progress-pill">
    ${ringSvg(doneStepsAll,totalStepsAll)}
    <div class="txt">已完成 <span class="num">${doneStepsAll}</span> / <span class="num">${totalStepsAll}</span> 个小步骤</div></div>`;

  // 进行中
  const active=must.concat(push).find(x=>!isDone(x));
  if(active){
    const ci=curStep(active);
    const steps=active['学习步骤']||[];
    html+=`<div class="section-lbl">进行中</div>
      <div class="active-card">
        <div class="subj">${esc(active['科目'])} · ${esc(active['章节'])}</div>
        <div class="title">${esc(active['任务成果'])}</div>
        <div class="step">当前步骤：${esc(steps[ci]||'即将开始')}</div>
        <button class="btn-primary" onclick="openFlow('${esc(active['任务编号'])}')">继续任务</button>
      </div>`;
  }

  // 接下来
  const upcoming=must.concat(push).filter(x=>!isDone(x));
  if(upcoming.length>1 || (upcoming.length>0 && (!active || upcoming[0]['任务编号']!==active['任务编号']))){
    html+=`<div class="section-lbl">接下来</div><div class="today-list">`;
    upcoming.forEach(x=>{
      if(active && x['任务编号']===active['任务编号'])return;
      html+=`<div class="row" onclick="openFlow('${esc(x['任务编号'])}')">
        <div class="check"></div>
        <div class="body">${esc(x['科目'])} · ${esc(shortOutcome(x))}</div>
        <div class="time"><span class="num">${esc(x['预计时间'])}</span> 分</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // 已完成
  const done=must.concat(push).filter(isDone);
  if(done.length>0){
    html+=`<div class="done-fold" onclick="toggleDone(this)">
      <span>已完成 ${done.length} 项</span><span>⌃</span>
    </div><div class="today-list" id="doneList">`;
    done.forEach(x=>{
      html+=`<div class="row done" onclick="openFlow('${esc(x['任务编号'])}')">
        <div class="check">✓</div>
        <div class="body">${esc(x['科目'])} · ${esc(shortOutcome(x))}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // 超额
  if(extra.length>0 && !isEasy()){
    if(extraUnlocked){
      html+=`<div class="section-lbl">${ic('gift','warm')} 超额奖励</div><div class="today-list">`;
      extra.forEach(x=>{
        html+=`<div class="row" onclick="openFlow('${esc(x['任务编号'])}')">
          <div class="check"></div>
          <div class="body">${esc(x['科目'])} · ${esc(shortOutcome(x))}</div>
          <div class="time"><span class="num">${esc(x['预计时间'])}</span> 分</div>
        </div>`;
      });
      html+=`</div>`;
    }else{
      html+=`<div class="empty">${ic('gift','warm')} 完成今日必做后解锁超额奖励任务</div>`;
    }
  }

  html+=`<div class="settle-line" onclick="openSettle()"><span class="tx">今天快结束了？来做个结算吧~ →</span><span class="arr">›</span></div>`;
  document.getElementById('view-today').innerHTML=html;
}
function toggleDone(el){const d=document.getElementById('doneList');if(!d)return;const show=d.style.display==='none';d.style.display=show?'block':'none';el.querySelector('span:last-child').textContent=show?'⌃':'⌄';}

  let h='<div class="page-title">月历</div>';
  h+='<div class="cal-layout"><div class="cal-main">';

    <div></div>
  </div>`;

  h+=renderCalPhaseHint();

  for(let d=1;d<=days;d++){
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const mk2=MOCK.find(x=>x[0]===ds);const dl=DEADLINES.find(x=>x[0]===ds);
    const hasMark=marks[ds]&&marks[ds].length>0;
    const done=dayComplete(ds,tasks);
    // 重要截止/考试 → 红；全真模考 → 黄；当天任务全部完成 → 绿（红优先于黄优先于绿）
    let mkCls='';
    if(dl)mkCls=' mk-red';
    else if(mk2)mkCls=' mk-yellow';
    else if(done)mkCls=' mk-done';
    const isMuted=(calY!==t.getFullYear()||calM!==t.getMonth());

    const numHtml=hasMark?`<span class="num-ring">${d}</span>`:d;
    h+=`<div class="cell${mkCls}${isToday?' today':''}${isMuted?' muted':''}" onclick="openDay('${ds}')">${numHtml}</div>`;
  }
  h+=`</div>`;

  // 事件列表：当月的事件+提醒
  const monthEvents=[];
  DEADLINES.forEach(d=>{if(d[0].startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`))monthEvents.push({ds:d[0],text:d[1],type:'red'});});
  MOCK.forEach(m=>{if(m[0].startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`))monthEvents.push({ds:m[0],text:'全真模考·'+m[1],type:'yellow'});});
  Object.keys(marks).forEach(ds=>{if(ds.startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`))marks[ds].forEach(tx=>monthEvents.push({ds:ds,text:tx,type:'green'}));});
  monthEvents.sort((a,b)=>a.ds.localeCompare(b.ds));
  if(monthEvents.length>0){
    const shownEvents=calExpandEvents?monthEvents:monthEvents.slice(0,6);
    shownEvents.forEach(e=>{
      const pd=parse(e.ds);
      const swSty=(e.type==='wood'||e.type==='green')?'':'width:12px;height:12px;border-radius:4px;';
      h+=`<div class="event-card"><span class="dot" style="background:var(--${e.type});${swSty}"></span>
        <div class="tx">${esc(e.text)}<div class="date">${e.ds.slice(5)} 周${['日','一','二','三','四','五','六'][wd(pd)]}</div></div>
      </div>`;
    });
    if(monthEvents.length>6){
      h+=`<div style="text-align:center;margin:-2px 0 16px"><span class="tapable" style="display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--primary);font-weight:800;cursor:pointer" onclick="calToggleEvents()">${calExpandEvents?'收起 ↑':'展开全部（共 '+monthEvents.length+' 条）↓'}</span></div>`;
    }
  }

  h+='</div><div class="cal-side">';
  // 四个阶段：日期醒目在上，阶段名缩小在下
  const curPhIdx=phaseIndexAt(fmt(today()));
  h+=`<div class="section-title">四个阶段</div>`;

    h+=`<div class="phase ${p.cls}">

    h+=`</ul></div>`;
  });

  if(typeof PENDING_NODES!=='undefined'&&PENDING_NODES.length){
    h+=`<div class="section-title">待确认节点</div><div class="pending-box">`;
    PENDING_NODES.forEach(p=>{
      h+=`<div class="event-card"><span class="dot" style="background:#E08A2B;width:12px;height:12px;border-radius:4px"></span>
        <div class="tx">${esc(p.label)}（待确认）<div class="date">预计窗口 ${esc(p.window||'待通知')}</div></div></div>`;
    });
    h+=`</div>`;
  }

  document.getElementById('view-cal').innerHTML=h;

function calShift(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCal();}

/* 日详情 / 手动添加提醒 */
function subjectColor(name){
  if(typeof CFG==='undefined'||!CFG.subjects)return '#888';
  const subs=CFG.subjects;
  const norm=n=>n?String(n).trim():'';
  const find=k=>subs.find(x=>norm(x.label)===k||norm(x.subject_id)===k);
  let s=find(norm(name));
  if(!s){
    // 兼容现有任务名称别名（不改变任务数据，只做显示映射）
    const alias={
      '英语':'英语一','英语一':'英语一',
      '政治':'政治',
      '天然药化':'天然药物化学','天然药物化学':'天然药物化学',
      '生药学':'生药学（中药鉴定学）','中药鉴定学':'生药学（中药鉴定学）','生药学（中药鉴定学）':'生药学（中药鉴定学）',
      '药剂学':'中药药剂学','中药药剂学':'中药药剂学'
    };
    const a=alias[norm(name)];
    if(a)s=find(a);
  }
  return s?s.color:'#888';
}
function tierClass(layer){
  if(layer==='必做')return 'must';
  if(layer==='推进')return 'progress';
  if(layer==='超额')return 'extra';

}

function addMark(){

function delMark(i){

}
