/* 最近 14 天各科用时折线：同一科目跨任务合并 */
function renderTimeChart(){
  const log=loadTimeLog();
  const N=14;
  const dates=[];
  for(let i=N-1;i>=0;i--)dates.push(fmt(addDays(today(),-i)));
  const subjects=[
    {key:'英语一',label:'英语',c:'#5B8FB9'},
    {key:'政治',label:'政治',c:'#C97A6A'},
    {key:'天然药物化学',label:'天然药物化学',c:'#6FAE8A'},
    {key:'生药学',label:'生药学',c:'#9B7BC9'},
    {key:'中药药剂学',label:'中药药剂学',c:'#C9A66A'}
  ];
  // 每个科目每天的分钟数
  const series={};
  subjects.forEach(s=>{series[s.key]=dates.map(d=>{const v=log[d]&&log[d][s.key];return v?Math.round(v/60):0;});});
  // 仅显示有数据的科目
  const used=subjects.filter(s=>dates.some((d,i)=>series[s.key][i]>0));
  let maxMin=0;
  subjects.forEach(s=>series[s.key].forEach(v=>{if(v>maxMin)maxMin=v;}));
  if(maxMin===0){
    return `<div class="tc-empty">还没有计时记录，完成一件任务后这里就会长出你的学习曲线 ${ic('leaf','green')}</div>`;
  }
  const niceMax=Math.max(10,Math.ceil(maxMin/10)*10);
  const W=340,H=172,padL=26,padR=10,padT=12,padB=22;
  const pw=W-padL-padR, ph=H-padT-padB;
  const xAt=i=>padL+pw*i/(N-1);
  const yAt=v=>padT+ph*(1-v/niceMax);
  let svg=`<svg class="timechart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  // 横向网格 + Y 轴刻度
  const ticks=2;
  for(let t=0;t<=ticks;t++){
    const val=niceMax*t/ticks;
    const y=yAt(val);
    svg+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--ring-track)" stroke-width="1"/>`;
    svg+=`<text x="${padL-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--sub)">${val}</text>`;
  }
  // X 轴日期（每 3 天）
  dates.forEach((d,i)=>{
    if(i%3===0||i===N-1){
      const mm=d.slice(5,7), dd=d.slice(8,10);
      svg+=`<text x="${xAt(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="var(--sub)">${mm}/${dd}</text>`;
    }
  });
  // 折线
  used.forEach(s=>{
    const pts=series[s.key].map((v,i)=>`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
    svg+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    series[s.key].forEach((v,i)=>{
      if(v>0){
        const x=xAt(i).toFixed(1), y=yAt(v).toFixed(1);
        const di=dates[i], mm=di.slice(5,7), dd=di.slice(8,10);
        svg+=`<circle cx="${x}" cy="${y}" r="5" fill="transparent" style="cursor:pointer" onclick="showTimeTip('${esc(s.label)}','${mm}/${dd}',${v})"/>`;
        svg+=`<circle cx="${x}" cy="${y}" r="2.8" fill="${s.c}" pointer-events="none"/>`;
      }
    });
  });
  svg+=`</svg>`;
  let legend=`<div class="tc-legend">`;
  used.forEach(s=>{legend+=`<div class="it"><span class="sw" style="background:${s.c}"></span>${esc(s.label)}</div>`;});
  legend+=`</div>`;
  return `<div class="tc-head"><b>最近 14 天</b> · 单位：分钟</div>`+svg+legend;
}

/* ============ 英语/政治计划任务进度 ============
   分母来自整个备考期的计划卡清单，不受滚动7天窗口影响；
   分子按 progress_unit_id 去重，一张完整计划卡只计1项。 */
const PROGRESS_PLAN_VERSION='2026-08-01-v2';
const PROGRESS_PHASE_KEYS=['P1','P2','P3','P4'];
function progressDays(from,to,predicate){
  let n=0,d=new Date(from);d.setHours(0,0,0,0);
  const end=new Date(to);end.setHours(0,0,0,0);
  while(d<=end){if(!predicate||predicate(d))n++;d=addDays(d,1);}
  return n;
}
function progressWeekCount(from,to){
  // 周频率按阶段起始日切分计划周，避免跨月/跨自然周时多算一整周。
  return Math.ceil(progressDays(from,to)/7);
}
function progressPhaseBounds(key){
  const p=PHASES.find(x=>x.key===key);
  return p?{from:p.start,to:p.end}:null;
}
function progressMockCount(subjectId,bounds){
  return (cfg('mock_events')||[]).filter(m=>m.subject_id===subjectId&&bounds&&
    parse(m.date)>=bounds.from&&parse(m.date)<=bounds.to).length;
}
function progressMajorSubjectForDate(d){
  const names=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  return (cfg('weekly_rotation')||{})[names[d.getDay()]]||null;
}
function progressMajorCardCount(subjectId,bounds){
  return progressDays(bounds.from,bounds.to,d=>progressMajorSubjectForDate(d)===subjectId);
}
function buildProgressPlan(){
  const b={};PROGRESS_PHASE_KEYS.forEach(k=>{b[k]=progressPhaseBounds(k);});
  const days=k=>progressDays(b[k].from,b[k].to);
  const saturdays=k=>progressDays(b[k].from,b[k].to,d=>d.getDay()===6);
  const sundays=k=>progressDays(b[k].from,b[k].to,d=>d.getDay()===0);
  const weeks=k=>progressWeekCount(b[k].from,b[k].to);
  const p1ReadingWeeks=8; // CFG 明确为“前8周”
  const english={
    P1:days('P1') + p1ReadingWeeks*5 + saturdays('P1') + sundays('P1'),
    P2:days('P2') + weeks('P2')*(5+2+2+2),
    P3:days('P3') + weeks('P3')*(3+2) + progressMockCount('ENGLISH',b.P3),
    P4:days('P4')*2
  };
  const politics={
    P1:weeks('P1')*4 + sundays('P1'),
    P2:weeks('P2')*5 + sundays('P2'),
    P3:days('P3') + sundays('P3') + progressMockCount('POLITICS',b.P3),
    P4:days('P4') + sundays('P4') + progressMockCount('POLITICS',b.P4)
  };
  const majorIds=['NATURAL_CHEM','PHARMACOGNOSY','PHARMACEUTICS'];
  const majors={};
  majorIds.forEach(id=>{
    const queue=(cfg('round_1_unit_queues')||{})[id]||[];
    majors[id]={
      P1:queue.length||progressMajorCardCount(id,b.P1),
      P2:progressMajorCardCount(id,b.P2),
      P3:progressMajorCardCount(id,b.P3),
      P4:progressMajorCardCount(id,b.P4)
    };
  });
  // 周日补漏和专业课综合模考是三门共享卡，不重复归入任一单科进度。
  return {ENGLISH:english,POLITICS:politics,...majors};
}
function loadProgressPlan(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY_PROGRESS_PLAN)||'null');
    if(saved&&saved.version===PROGRESS_PLAN_VERSION&&saved.planId===CFG.plan.plan_id&&
       saved.cfgVersion===CFG.schema_version&&saved.totals)return saved.totals;
  }catch(e){}
  const totals=buildProgressPlan();
  try{localStorage.setItem(KEY_PROGRESS_PLAN,JSON.stringify({
    version:PROGRESS_PLAN_VERSION,planId:CFG.plan.plan_id,cfgVersion:CFG.schema_version,
    generatedAt:new Date().toISOString(),totals:totals
  }));}catch(e){}
  return totals;
}
function progressTaskId(t){return (t&& (t.task_id||t['任务编号']))||'';}
function progressSubjectId(t){
  const ds=t&& (t.scheduled_date||t['日期']);
  const type=t&& (t.task_type||'');
  if(type==='MOCK'){
    const event=(cfg('mock_events')||[]).find(m=>m.date===ds);
    if(event)return event.subject_id;
  }
  return t&&t.subject_id||subjectIdOf(t&&t['科目']||'');
}
function progressRootTask(t,byId){
  let cur=t;const seen={};
  for(let i=0;i<12;i++){
    const id=progressTaskId(cur);if(id&&seen[id])break;if(id)seen[id]=true;
    const parentId=cur.root_task_id||cur.source_task_id||cur._from;
    if(!parentId||parentId===id)break;
    const parent=byId[parentId];if(!parent)break;cur=parent;
  }
  return cur;
}
function progressUnitId(t,root){return t.progress_unit_id||root.progress_unit_id||progressTaskId(root);}
function progressPhaseId(t,root){
  return root.phase_id||phaseIdOf(root.scheduled_date||root['日期'])||t.phase_id||phaseIdOf(t.scheduled_date||t['日期']);
}
function isFormalProgressTask(t){
  if(!t||t['隐藏']||t.hidden||t.include_in_plan===false)return false;
  if(t.manual===true||t.task_origin==='MANUAL'||t['手动']===true)return false;
  const tier=t.tier||t['层']||t['任务类型'];
  if(tier==='EXTRA'||tier==='超额')return false;
  const id=progressTaskId(t);
  return t.task_origin==='GENERATED'||t.task_origin==='RESCHEDULED'||/^KY2027-|^[DR]\d{4}-/.test(id);
}
function isProgressTaskDone(t){
  const steps=Array.isArray(t.steps)&&t.steps.length?t.steps:(t['学习步骤']||[]);
  if(!steps.length)return t.task_status==='COMPLETED'||!!t._done;
  const completed=t.completed_step_ids||t._completedStepIds;
  if(Array.isArray(completed)&&completed.length&&steps[0]&&typeof steps[0]==='object'){
    const done=new Set(completed);return steps.every(s=>done.has(s.step_id));
  }
  return isDone(t);
}
function planProgress(tasks,subjectId){
  const totals=loadProgressPlan()[subjectId]||{};
  const byId={};tasks.forEach(t=>{const id=progressTaskId(t);if(id)byId[id]=t;});
  const units=new Map();
  tasks.forEach(t=>{
    if(!isFormalProgressTask(t)||progressSubjectId(t)!==subjectId)return;
    const root=progressRootTask(t,byId),unit=progressUnitId(t,root),phase=progressPhaseId(t,root);
    if(!unit||!totals[phase])return;
    const key=subjectId+'|'+phase+'|'+unit;
    const old=units.get(key)||{phase:phase,done:false};
    old.done=old.done||isProgressTaskDone(t);units.set(key,old);
  });
  const rounds=PROGRESS_PHASE_KEYS.map(phase=>{
    const list=[...units.values()].filter(x=>x.phase===phase);
    const done=list.filter(x=>x.done).length,total=totals[phase]||0;
    return {total,done,pct:total?Math.round(done/total*100):0,empty:false};
  });
  const total=rounds.reduce((n,r)=>n+r.total,0),done=rounds.reduce((n,r)=>n+r.done,0);
  return {rounds,total,done,pct:total?Math.round(done/total*100):0,planned:true};
}
function roundProgress(tasks,subj,round){
  const list=tasks.filter(x=>!x['隐藏']&&x['科目'].indexOf(subj)>=0
    &&parse(x['日期'])>=round.start&&parse(x['日期'])<=round.end);
  if(list.length===0)return {total:0,done:0,pct:0,empty:true};
  const total=list.reduce((a,b)=>a+(totalSteps(b)||1),0);
  const done=list.reduce((a,b)=>a+(isDone(b)?(totalSteps(b)||1):doneCount(b)),0);
  return {total,done,pct:total?Math.round(done/total*100):0,empty:false};
}

/* ============ 学习流程视图 ============ */
let flowId=null,flowTimer=null,flowElapsed=0,flowNextExpanded=false,lastFlowPct=0,flowSplitBackup=null;
function taskMatchesId(task,id){
  return !!task && ((task.task_id&&task.task_id===id)||(task['任务编号']&&task['任务编号']===id));
}
function openFlow(id){
  pauseTimer();flowSplitBackup=null;
  const tasks=load();
  const t=tasks.find(x=>taskMatchesId(x,id));
  flowId=id;
  flowElapsed=(t && typeof t._time==='number')?t._time:0;
  switchView('flow');
  renderFlow();
  if(t && !isDone(t)) startTimer();
}
function closeFlow(){
  saveFlowTime();
  pauseTimer();
  switchView(lastMainView||'today');
  flowId=null;flowNextExpanded=false;flowSplitBackup=null;
}
function saveFlowTime(){
  if(!flowId || flowElapsed<=0)return;
  const tasks=load();const x=tasks.find(z=>taskMatchesId(z,flowId));if(!x)return;
  const old=x._time||0;
  const added=Math.max(0,flowElapsed-old);
  if(added>0)addTimeLog(fmt(today()),x['科目'],added);
  x._time=flowElapsed;
  save(tasks);
}
function getFlow(){return load().find(x=>taskMatchesId(x,flowId));}
function curStep(t){const sd=t['_stepDone']||(t['学习步骤']||[]).map(()=>false);for(let i=0;i<sd.length;i++)if(!sd[i])return i;return sd.length;}
function renderFlow(){
  const t=getFlow();if(!t){closeFlow();return;}
  const steps=t['学习步骤']||[];const sd=t['_stepDone']||steps.map(()=>false);
  const total=steps.length;const done=sd.filter(Boolean).length;
  const ci=curStep(t);
  const allDone=ci>=total;
  const sug=allDone?0:Math.max(5,Math.round((t['预计时间']||30)/total));
  const avgMin=estimateMinutes(t);
  const avgLine=(avgMin&&avgMin>=1)?`<div class="avg-line">根据最近记录，通常约 ${Math.round(avgMin)} 分钟</div>`:'';
  const timerBox=`<div class="timer-box"><span class="lab">本次已用</span><div class="time num" id="timer">${fmtTime(flowElapsed)}</div></div>`;

  // 顶部进度条
  const pct=total?Math.round(done/total*100):100;
  const topUndo=ci>0?`<span class="bar-undo tapable" onclick="flowUndoStep(${Math.max(0,ci-1)})">${ic('undo')} 上一步回退</span>`:'';
  const bar=`
    <div class="step-bar">
      <div class="track"><div class="fill" style="width:${lastFlowPct}%"></div></div>
      <div class="bar-info"><span>第 ${Math.min(ci+1,total)} / ${total} 步 · 已完成 ${done}</span>${topUndo}</div>
    </div>`;

  let h=`<div class="flow-header">
    <div class="back" onclick="closeFlow()">‹</div>
    <div class="pause" onclick="flowPauseResume()">${flowTimer?'暂停':'继续'}</div>
    <div class="spacer"></div>
  </div>`;

  h+=`<div class="flow-title-row"><div class="big-title">${esc(t['任务成果'])}</div></div>`;

  h+=`<div class="flow-chips">
    <span class="chip">${esc(t['科目'])}</span>
    <span class="chip">${esc(t['层'])}</span>
    ${star(t['优先级'])}
  </div>`;

  if(t['配套资料']){
    h+=`<div class="flow-res">${ic('book','warm')}<span class="lab">配套资料</span><span>${esc(t['配套资料'])}</span></div>`;
  }

  h+=bar;

  if(allDone){
    h+=`<div class="step-card">
        <div class="step-current">
          <div class="step-circle-col">
            <div class="step-label">当前步骤</div>
            <div class="circle done">✓</div>
          </div>
          <div class="body">
            <div class="title-row"><div class="title">全部步骤完成！</div></div>
          </div>
          ${timerBox}
        </div>
        <div class="desc">这一步已经收尾，可以回到今日页把它标记为完成。</div>
      </div>
      <div class="flow-ctrl">
        <button class="btn-primary" onclick="flowMain()">标记为完成 ✓</button>
      </div>`;
  }else{
    h+=`<div class="step-card">
      <div class="step-current">
        <div class="step-circle-col">
          <div class="step-label">当前步骤</div>
          <div class="circle" onclick="flowMain()">${ci+1}</div>
        </div>
        <div class="body">
          <div class="title-row"><div class="title">${esc(steps[ci])}</div></div>
          <div class="time-chip">${ic('clock','green')}建议用时约 ${sug} 分钟</div>
          ${avgLine}
        </div>
        ${timerBox}
        ${flowSplitBackup&&flowSplitBackup.id===flowId?`<div class="split-undo tapable" onclick="undoSplit()">${ic('undo')} 撤销拆解</div>`:''}
      </div>
    </div>`;

    // 接下来步骤：每个步骤独立卡片展示，默认显示前 2 条，多的折叠
    // 始终渲染标题与容器（最后一步时用温和文案占位），保证布局高度稳定
    const upcoming=[];
    const stepMin=Math.max(5,Math.round((t['预计时间']||30)/total));
    for(let i=ci+1;i<total;i++) upcoming.push({idx:i,text:steps[i]});
    h+=`<div class="next-list-title">${upcoming.length>0?'接下来（先专注当前步）':'✨ 已经是最后一步，做完这件就收工'}</div>
    <div class="next-list">`;
    if(upcoming.length>0){
      const show=flowNextExpanded?upcoming:upcoming.slice(0,2);
      show.forEach(s=>{
        h+=`<div class="next-card">
          <span class="body">${esc(s.text)}</span>
          <span class="time">约${stepMin}分钟</span>
        </div>`;
      });
      if(!flowNextExpanded && upcoming.length>2){
        h+=`<div class="next-card fold tapable" onclick="expandFlowNext()">…还有 ${upcoming.length-2} 步</div>`;
      }else if(flowNextExpanded && upcoming.length>2){
        h+=`<div class="next-card fold tapable" onclick="collapseFlowNext()">收起</div>`;
      }
    }
    h+=`</div>`;

    h+=`<div class="flow-ctrl">
      <button class="btn-primary" onclick="flowMain()">完成这一步 ✓</button>
      <div class="btn-row">
        <button onclick="flowStopHere()">今天做到这里</button>
        <button onclick="flowSplit()">步骤太大</button>
      </div>
    </div>`;
  }
  document.getElementById('view-flow').innerHTML=h;
  const fb=document.querySelector('#view-flow .step-bar .fill');
  if(fb)requestAnimationFrame(()=>{fb.style.width=pct+'%';});
  lastFlowPct=pct;
}
function expandFlowNext(){flowNextExpanded=true;renderFlow();}
function collapseFlowNext(){flowNextExpanded=false;renderFlow();}
function flowPauseResume(){if(flowTimer)pauseTimer();else startTimer();}
function flowMain(){
  const t=getFlow();if(!t)return;const ci=curStep(t);
  if(ci>=(t['学习步骤']||[]).length){finishTask();return;}
  flowDoneStep(ci);
}
function startTimer(){
  pauseTimer();flowTimer=setInterval(()=>{
    flowElapsed++;const el=document.getElementById('timer');if(el)el.textContent=fmtTime(flowElapsed);
  },1000);
  const p=document.querySelector('.flow-header .pause');if(p)p.textContent='暂停';
}
function pauseTimer(){
  if(flowTimer){clearInterval(flowTimer);flowTimer=null;}
  const p=document.querySelector('.flow-header .pause');if(p)p.textContent='继续';
}
function flowStopHere(){
  const t=getFlow();if(!t)return;
  saveFlowTime();
  pauseTimer();toast('已保存进度，今天做到这里 '+ic('leaf','green'));closeFlow();
}
function flowDoneStep(i){
  const t=getFlow();if(!t)return;
  let steps=t.steps&&t.steps.length?t.steps:buildSteps(t.task_id,t['学习步骤']||[]);
  const labels=stepLabels(steps);
  if(i<0||i>=steps.length)return;
  const sd=t._stepDone||steps.map(()=>false);
  for(let k=0;k<=i;k++)sd[k]=true;
  // completed_step_ids 为权威来源：把 0..i 全部对应 step_id 写入完成集合
  const c=new Set();
  steps.forEach((s,k)=>{if(sd[k]&&s.step_id)c.add(s.step_id);});
  if(steps[i])steps[i].status='COMPLETED';
  const _stepDone=doneArrFromSteps(steps,[...c]); // 由完成集派生，保证一致
  t.steps=steps;t['学习步骤']=labels;t._stepDone=_stepDone;t.completed_step_ids=[...c];
  t._done=(steps.length>0&&_stepDone.every(Boolean));
  const tasks=load();const x=tasks.find(z=>taskMatchesId(z,flowId));if(x){Object.assign(x,t);save(tasks);}
  flowSplitBackup=null;
  pauseTimer();
  if(_stepDone.every(Boolean)){finishTask();return;}   // 所有步都真完成 → 结算
  renderFlow();startTimer();toast('已完成，进入下一步');
}
function flowUndoStep(i){
  const t=getFlow();if(!t)return;
  let steps=t.steps&&t.steps.length?t.steps:buildSteps(t.task_id,t['学习步骤']||[]);
  const labels=stepLabels(steps);
  const sd=t._stepDone||steps.map(()=>false);
  for(let k=i;k<sd.length;k++)sd[k]=false;
  const c=new Set(t.completed_step_ids||[]);
  for(let k=i;k<steps.length;k++){if(steps[k])c.delete(steps[k].step_id);}
  steps.forEach((s,k)=>{if(k>=i&&s)s.status='PENDING';});
  t.steps=steps;t['学习步骤']=labels;t._stepDone=sd;t.completed_step_ids=[...c];t._done=false;
  const tasks=load();const x=tasks.find(z=>taskMatchesId(z,flowId));if(x){Object.assign(x,t);save(tasks);}
  pauseTimer();renderFlow();toast('已回退到这一步');
}
/* ---- 一件任务收尾：结算 + 自动接上下一件 ---- */
let doneNextId=null,doneTick=null;
function finishTask(){
  pauseTimer();
  flowSplitBackup=null;
  const fid=flowId;
  const tasks=load();const x=tasks.find(z=>taskMatchesId(z,fid));
  if(x){
    const st=x.steps&&x.steps.length?x.steps:buildSteps(x.task_id,x['学习步骤']||[]);
    x._done=true;
    x._stepDone=st.map(()=>true);
    x.steps=st.map(s=>{s.status='COMPLETED';return s;});
    x.completed_step_ids=st.map(s=>s.step_id);
    x.task_status='COMPLETED';
    const old=x._time||0;
    const added=Math.max(0,flowElapsed-old); // 本次净增（先合并本次计时）
    if(added>0){ addTimeLog(fmt(today()),x['科目'],added); x._time=old+added; }
    else { x._time=Math.max(old, flowElapsed); }
    const mins=Math.round((x._time||0)/60);
    x.actual_minutes=mins;
    x.history=(x.history||[]).concat([{date:fmt(today()),minutes:mins,status:'COMPLETED',task_id:x.task_id}]);
    save(tasks);
    if(x['层']!=='超额') recordStreakDate(fmt(today()));
  }
  flowElapsed=0;
  const nx=pickFocus(fid);
  doneNextId=nx?nx['任务编号']:null;
  homeFocusId=doneNextId;              // 首页主打自动前移到下一件
  renderHome();renderToday();
  document.getElementById('dm-title').innerHTML=nx?'这一件完成啦':'今天的任务都完成了 '+ic('leaf','green');
  document.getElementById('dm-sub').innerHTML=x?('刚刚完成：'+esc(x['科目'])+' · '+esc(shortOutcome(x))):'';
  const box=document.getElementById('dm-next'),go=document.getElementById('dm-go'),tip=document.getElementById('dm-tip');
  if(nx){
    box.style.display='';
    box.innerHTML=`<div class="lb">接下来这一件</div><div class="tt">${esc(nx['章节'])}</div>
      <div class="mt">${esc(nx['科目'])} · 约 <span class="num">${esc(nx['预计时间'])}</span> 分钟 · ${esc(shortOutcome(nx))}</div>`;
    go.textContent='接着做下一件 →';
    startDoneCountdown(5);
  }else{
    box.style.display='none';
    tip.innerHTML='待办已经清空啦，去看看今日结算，或者好好休息一下。';
    go.textContent='看今日结算';
  }
  document.getElementById('doneModal').classList.add('show');
}
function startDoneCountdown(n){
  stopDoneCountdown();
  let left=n;const tip=document.getElementById('dm-tip');
  tip.innerHTML=`<b>${left}</b> 秒后自动进入下一件`;
  doneTick=setInterval(()=>{
    left--;
    if(left<=0){stopDoneCountdown();goNextTask();return;}
    tip.innerHTML=`<b>${left}</b> 秒后自动进入下一件`;
  },1000);
}
function stopDoneCountdown(){if(doneTick){clearInterval(doneTick);doneTick=null;}}
function goNextTask(){
  stopDoneCountdown();

}
function flowSplit(){
  const t=getFlow();if(!t)return;const ci=curStep(t);
  let steps=t.steps&&t.steps.length?t.steps:buildSteps(t.task_id,t['学习步骤']||[]);
  const sd=t._stepDone||steps.map(()=>false);
  if(ci>=steps.length)return;
  document.getElementById('split-old').textContent='原步骤：'+(steps[ci]?steps[ci].label:t['学习步骤'][ci]);
  document.getElementById('split-a').value='';document.getElementById('split-b').value='';
  flowSplitBackup={id:flowId,ci:ci,steps:steps.slice(),sd:sd.slice(),user_modified_steps:(t.user_modified_steps===true)};
  document.getElementById('splitModal').classList.add('show');
}
function doSplit(){
  const a=document.getElementById('split-a').value.trim();
  const b=document.getElementById('split-b').value.trim();
  if(!a||!b){toast('请填好前后两步');return;}
  const t=getFlow();if(!t)return;const ci=curStep(t);
  let steps=t.steps&&t.steps.length?t.steps:buildSteps(t.task_id,t['学习步骤']||[]);
  const sd=t._stepDone||steps.map(()=>false);
  if(ci>=steps.length)return;
  // 拆分前完整备份原始状态（含 user_modified_steps），保证 undoSplit 能无损恢复（阻断修复#7）
  flowSplitBackup={id:flowId,ci:ci,steps:steps.slice(),sd:sd.slice(),user_modified_steps:(t.user_modified_steps===true)};
  const parent=steps[ci]||{step_id:t.task_id+'-Ssplit-'+ci,label:t['学习步骤'][ci]};
  const parentId=parent.step_id;
  const childA={step_id:parentId+'-c1',label:a,status:sd[ci]?'COMPLETED':'PENDING',parent_step_id:parentId};
  const childB={step_id:parentId+'-c2',label:b,status:sd[ci]?'COMPLETED':'PENDING',parent_step_id:parentId};
  steps.splice(ci,1,childA,childB);sd.splice(ci,1,sd[ci],sd[ci]);
  const c=new Set(t.completed_step_ids||[]);
  c.delete(parentId);
  if(sd[ci]){c.add(childA.step_id);c.add(childB.step_id);}
  t.steps=steps;t['学习步骤']=stepLabels(steps);t._stepDone=sd;t.completed_step_ids=[...c];t.user_modified_steps=true;
  const tasks=load();const x=tasks.find(z=>taskMatchesId(z,flowId));if(x){Object.assign(x,t);save(tasks);}
  closeSplit();renderFlow();toast('已拆成两步，慢慢来');
}
function undoSplit(){
  if(!flowSplitBackup||flowSplitBackup.id!==flowId)return;
  const t=getFlow();if(!t)return;
  const ci=flowSplitBackup.ci;
  let steps=flowSplitBackup.steps.map(s=>({step_id:(s&&s.step_id)?s.step_id:(t.task_id+'-S'+hash8(String(s&&s.label!=null?s.label:s))+'-1'),label:(s&&s.label!=null)?s.label:s,status:'PENDING',step_key:(s&&s.step_key)?s.step_key:undefined,parent_step_id:(s&&s.parent_step_id)?s.parent_step_id:undefined}));
  let sd=flowSplitBackup.sd.slice();
  const c=new Set();steps.forEach((s,k)=>{if(sd[k])c.add(s.step_id);});
  t.steps=steps;t['学习步骤']=stepLabels(steps);t._stepDone=sd;t.completed_step_ids=[...c];t.user_modified_steps=(flowSplitBackup.user_modified_steps===true);
    const tasks=load();const x=tasks.find(z=>taskMatchesId(z,flowId));if(x){Object.assign(x,t);save(tasks);}
  flowSplitBackup=null;
  renderFlow();toast('已撤销拆解，恢复原步骤');
}

let settleQueue=[],settleIdx=0;
function openSettle(){
  const t=today(),ds=fmt(t);
  const all=tasksOfDate(ds).filter(x=>(x['层']==='必做'||x['层']==='推进')&&!isDone(x));
  settleQueue=all;settleIdx=0;
  switchView('settle');
  renderSettle();
}
function closeSettle(){switchView('today');settleQueue=[];}
function renderSettle(){
  const t=today();
  const names=['日','一','二','三','四','五','六'];
  const body=document.getElementById('view-settle');
  if(settleIdx>=settleQueue.length){
    body.innerHTML=`<div class="settle-header"><div class="title">今日结算</div><div class="later" onclick="closeSettle()">关闭</div></div>
      <div class="settle-date">${t.getMonth()+1}月${t.getDate()}日 周${names[wd(t)]}</div>
      <div style="text-align:center;margin-top:60px;font-size:16px;color:var(--primary);line-height:1.7">${ic('leaf','green')} 都处理好了。<br>剩下的交给明天，今晚好好休息。</div>`;
    return;
  }
  const tk=settleQueue[settleIdx];
  const sc=doneCount(tk),tt=totalSteps(tk);
  const ratio=tt?Math.round(sc/tt*100):0;
  let html=`<div class="settle-header"><div class="title">今日结算</div><div class="later" onclick="closeSettle()">稍后</div></div>
    <div class="settle-date">${t.getMonth()+1}月${t.getDate()}日 周${names[wd(t)]}</div>
    <div class="big-count"><div class="n num">${settleQueue.length-settleIdx}</div><div class="t">个任务还没完成</div></div>
    <div class="sec-lbl">先处理这一个</div>
    <div class="settle-task">
      <div class="title">${esc(tk['任务成果'])}</div>
      <div class="meta">原计划 <span class="num">${esc(tk['预计时间'])}</span> 分钟 · ${ratio===0?'今天还没开始':ratio<50?'已完成 '+ratio+'%，剩下一大半':'已完成 '+ratio+'%，只差收尾'}</div>
    </div>
    <div class="opt-card gentle" onclick="settleChoose('gentle')"><div><div class="ot">温和恢复</div><div class="od">顺延到明天，今天先放过自己</div></div><div class="arr">›</div></div>
    <div class="opt-card keep" onclick="settleChoose('keep')"><div><div class="ot">保持截止日期</div><div class="od">截止不变，明天照常推进</div></div><div class="arr">›</div></div>
    <div class="opt-card catch" onclick="settleChoose('catch')"><div><div class="ot">主动追赶</div><div class="od">今晚加一场 20 分钟补回来</div></div><div class="arr">›</div></div>
    <div class="settle-foot"><div class="count">已完成 ${settleIdx} / ${settleQueue.length}</div><button class="next" onclick="settleSkip()">下一个 →</button></div>`;
  body.innerHTML=html;
}
function settleChoose(mode){
  const t=settleQueue[settleIdx];if(!t)return;
  const tasks=load();const x=tasks.find(z=>z['任务编号']===t['任务编号']);
  if(x){
    if(mode==='gentle'){x['日期']=fmt(addDays(today(),1));save(tasks);incGentleCount();toast('已顺延到明天 '+ic('leaf','green'));}
    else if(mode==='catch'){toast('今晚加一场 20 分钟补回来 '+ic('muscle','warm'));}
    else {toast('保持原计划');}
  }
  settleIdx++;
  renderSettle();
}
function settleSkip(){settleIdx++;renderSettle();}

/* ============ Toast ============ */
let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.innerHTML=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}

/* ============ 点击手感：按下微沉 → 松手浮起回弹 ============ */
const TAP_SEL='.tapable,.btn-primary,.btn-row button,.mode-card .switch,.settle-foot .next,'
  +'.wheel-close,.modal .box .mb button,.cal-arrows button,.flow-header .back,.flow-header .pause,.map-btn,'
  +'.tabbar button,.simple-list .item,.today-list .row,.action-list .row,.opt-card,.settle-line,'
  +'.done-fold,.cal-grid .cell,.step-current .circle,.next-card,'
  +'.settle-header .later,.daybox .mitem .del';
let tapEl=null,tapClr=null;
function tapDown(e){
  const t=e.target;const el=(t&&t.closest)?t.closest(TAP_SEL):null;
  if(!el)return;
  if(tapEl&&tapEl!==el)tapEl.classList.remove('tap-press');
  tapEl=el;
  el.classList.remove('tap-lift');
  el.classList.add('tap-press');
}
function tapUp(){
  if(!tapEl)return;
  const el=tapEl;tapEl=null;
  el.classList.remove('tap-press');
  el.classList.remove('tap-lift');
  void el.offsetWidth;            // 强制重排，连点时动画能重新播放
  el.classList.add('tap-lift');
  clearTimeout(tapClr);
  tapClr=setTimeout(()=>el.classList.remove('tap-lift'),460);
}
function bindTapFeel(){
  if(typeof document==='undefined'||!document.addEventListener)return;
  const opt={passive:true};
  if(typeof window!=='undefined'&&window.PointerEvent){
    document.addEventListener('pointerdown',tapDown,opt);
    document.addEventListener('pointerup',tapUp,opt);
    document.addEventListener('pointercancel',tapUp,opt);
  }else{
    document.addEventListener('touchstart',tapDown,opt);
    document.addEventListener('touchend',tapUp,opt);
    document.addEventListener('touchcancel',tapUp,opt);
    document.addEventListener('mousedown',tapDown,opt);
    document.addEventListener('mouseup',tapUp,opt);
  }
  document.addEventListener('touchstart',function(){},opt); // 让 :active 在移动端生效
}

/* ============ 启动 ============ */
function init(){
  migrateToRolling7();
  migrateStableIdsV2();   // 阶段2：稳定 ID 迁移（v2，可修复 v1 数据，幂等）
  ensureRolling();
  bindTapFeel();
  // 离开/刷新页面时兜底保存当前流程计时
  window.addEventListener('beforeunload',()=>{saveFlowTime();});
  // 底部导航图标替换为简约 SVG
  const navMap={home:'home',today:'today',cal:'calendar',mine:'user'};
  Object.keys(navMap).forEach(k=>{
    const el=document.querySelector('#nav-'+k+' .ic');
    if(el)el.innerHTML=ic(navMap[k]);
  });
  renderHome();
  // 问候语随时间自动更新：不刷新整页、不重生成首页任务
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden)updateGreeting(); });
  window.addEventListener('focus',updateGreeting);
  if(!window.__greetTimer)window.__greetTimer=setInterval(updateGreeting,30000);
  if(window.__migrated&&window.__migrated.archived>0)toast('已自动备份旧数据，并切换为滚动7天计划（归档 '+window.__migrated.archived+' 条旧远期任务）');
}
init();
